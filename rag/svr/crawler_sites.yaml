  # --------------------------------------------------------------------------
  # zjfw_zhangzhou_notice — 漳州市工程项目网上中介服务平台-公告（7 栏目）
  # Target: http://zjfw.zhangzhou.gov.cn/imng/zjfw/browse/...
  # Adapter: spa_render + api_capture + route_override
  #   - api-v2 端点 ?s=&t= 签名由 SPA 自然 XHR 时生成，浏览器直接 fetch 会失败
  #   - 导航到 SPA 列表页让 SPA 自己触发 XHR，_on_response 捕获
  #   - route_override 拦截 POST body 注入 publish_start_time/end_time (昨天→今天)
  #     + limit:50，单次 XHR 拿足够当天数据，无需 click_next 翻页
  #   - 详情页 URL 模式：bid_view(id,type) → /imng/zjfw/browse/<module>/<module>Detail?id={ID}&type={TYPE}
  # Sections: 7 个公告类型（采购/澄清/重发/终止/流标/中选/中选变更）
  # --------------------------------------------------------------------------
  zjfw_zhangzhou_notice:
    name: "漳州市工程项目网上中介服务平台-公告"
    site_url: "http://zjfw.zhangzhou.gov.cn"
    category: tender
    enabled: true
    detect_enabled: true
    detect_interval: 600
    transport:
      type: spa_render
      engine: playwright_spa
      network_idle: false               # 政府站 analytics 让 networkidle 永不空闲
      route_override:                   # ★ 拦截 SPA XHR 注入日期 + limit
        url_match: "api-v2"
        method: POST
        body_has_key: "publish_start_time"   # 只 amend 列表查询 body，不动 getConfigInfo 等
        merge_body:
          publish_start_time: "{{ 1_days_ago }}"
          publish_end_time: "{{ today }}"
          start: 0
          limit: 50                     # 单次拉 50 条覆盖当天数据
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36"
        Accept: "application/json, text/plain, */*"
      verify_ssl: false
      timeout: 60
    pagination:
      type: single_page                # route_override 已把 limit 改 50，单页足够
      items_field: "data"
    anti_crawler:
      delay_min: 1.5
      delay_max: 3.0
      max_retries: 3
      max_consecutive_empty: 3
    extract:
      type: json_path
      items_path: "data"               # 响应 {total: N, data: [...]}
      fields:
        id:    "ID"
        title: "TITLE"
        date:  "AUDIT_DATE_CHAR"       # 审核通过时间（发布时间）
        region: "NAME"                 # 区域名（如"龙海区"）
        owner: "CROP_NAME"             # 业主单位
        item_type: "TYPE"              # 公告子类型（用于详情 URL type 参数）
        create_date: "CREATDATE"
    format:
      parser_id: "naive"
      template: |
        # {{ title }}

        **发布时间:** {{ date }}
        **区域:** {{ region }}
        **业主单位:** {{ owner }}
        **来源:** 漳州市工程项目网上中介服务平台
        **原文链接:** {{ url }}

        {{ content }}
      upload_batch_size: 5
    sections:
      - label: cggg
        name: "漳州市-采购公告"
        listing:
          url: "http://zjfw.zhangzhou.gov.cn/imng/zjfw/browse/bidNotice/bidNotice"
          method: GET
        extract:
          type: json_path
          items_path: "data"
          fields:
            id:    "ID"
            title: "TITLE"
            date:  "AUDIT_DATE_CHAR"
            region: "NAME"
            owner: "CROP_NAME"
            item_type: "TYPE"
            create_date: "CREATDATE"
          url_template: "http://zjfw.zhangzhou.gov.cn/imng/zjfw/browse/bidNotice/bidNoticeDetail?id={ID}&type={TYPE}"
        detail:
          type: css_selector
          content_field: "#div_continer, .its-page, .tab-content"
          metadata_js: |
            () => {
              const result = {};
              document.querySelectorAll('li, span, p, .info-item, td').forEach(el => {
                const t = (el.textContent || '').trim();
                if (t.length > 200) return;
                const m1 = t.match(/发布时间[：:]\s*([\d\-/: ]+)/);
                if (m1 && !result.publish_datetime) result.publish_datetime = m1[1].trim();
                const m2 = t.match(/信息来源[：:]\s*(.+)/);
                if (m2 && !result.issuing_authority) result.issuing_authority = m2[1].trim();
                const m3 = t.match(/项目编号[：:]\s*(.+)/);
                if (m3 && !result.project_no) result.project_no = m3[1].trim();
                const m4 = t.match(/业主单位[：:]\s*(.+)/);
                if (m4 && !result.owner) result.owner = m4[1].trim();
              });
              const files = [];
              document.querySelectorAll('a').forEach(a => {
                const href = a.href || '';
                const name = (a.textContent || '').trim();
                if (/\.(pdf|docx?|xlsx?|zip|rar|7z)(\?|$)/i.test(href) || href.includes('downloadagent') || href.includes('/download')) {
                  files.push({ file_url: href, file_name: name || href.split('/').pop() });
                }
              });
              if (files.length) result.files = files;
              return result;
            }
