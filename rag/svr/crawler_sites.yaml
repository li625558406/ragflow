  # Old script: etrading_crawler.py
  # Verified: requests.Session, NO Playwright needed
  # --------------------------------------------------------------------------
  etrading:
    name: "福建电子交易平台-采购公告"
    site_url: "https://fujian.etrading.cn/"
    enabled: true
    transport:
