  # ggzyfw_fujian — 福建公共资源交易 (Article API, AES-256-CBC + MD5)
  # Old script: ggzyfw_fujian_crawler.py
  # Sections: xwdt(11), tzgg(12), hydt(13)
  # --------------------------------------------------------------------------
  ggzyfw_fujian:
    name: "福建省公共资源交易平台-新闻通知"
    site_url: "https://ggzyfw.fujian.gov.cn/"
    enabled: false  # DISABLED: API endpoint dead (HTTP 500)
    transport:
      type: encrypted_api
      engine: playwright_http
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
        Content-Type: "application/json;charset=UTF-8"
        Origin: "https://ggzyfw.fujian.gov.cn"
        Referer: "https://ggzyfw.fujian.gov.cn/"
      encryption:
        algorithm: aes_256_cbc
        key: "EB444973714E4A40876CE66BE45D5930"
        iv: "B5A8904209931867"
        key_encoding: utf8
        field: "Data"
        encoding: utf-8
      signing:
        algorithm: md5
        secret: "B3978D054A72A7002063637CCDF6B2E5"
        header_name: "portal-sign"
      verify_ssl: false
      timeout: 30
    listing:
      url: "https://ggzyfw.fj.gov.cn/FwPortalApi/Article/PageList"
      method: POST
      body_type: json
    pagination:
      type: page_no
      page_param: "pageNo"
      page_size_param: "pageSize"
      page_size: 50
      start: 1
      total_field: "total"
    anti_crawler:
      delay_min: 1.0
      delay_max: 2.5
      max_retries: 4
      exponential_backoff: true
    extract:
      type: json_path
      items_path: "rows"
      fields:
        id: "ID"
        title: "TITLE"
        date: "TM"
        type: "TYPE"
    detail:
      type: api_request
      url: "https://ggzyfw.fj.gov.cn/FwPortalApi/Article/Detail"
      method: POST
      body_type: json
      content_field: "CONTENTS"
    format:
      parser_id: "naive"
      upload_batch_size: 10
    sections:
      - label: "xwdt"
        listing:
          params:
            type: "11"
      - label: "tzgg"
        listing:
          params:
            type: "12"
      - label: "hydt"
        listing:
          params:
            type: "13"

