  # --------------------------------------------------------------------------
  # ggzyfw_fujian_policies — 福建省公共资源交易平台 · 政策法规
  # Source:  https://ggzyfw.fujian.gov.cn/policies/index
  # API:     https://ggzyfw.fujian.gov.cn/FwPortalApi/Article/PageList (AES-256-CBC + MD5 portal-sign)
  # Detail:  https://ggzyfw.fujian.gov.cn/FwPortalApi/Article/Detail (CONTENTS 字段为 HTML 正文)
  # Types:   92=法律法规/93=规范性文件/94=政策解读/96=业务指引/97=综合性文件/98=其他/922=子类
  # 时间过滤: timeType=7 即"近 7 天"，每次调度都滚动窗口去重 upsert，无需依赖 date_filter
  # Category: policy — 结构化字段(发文机构等)入 collection_policy_ext；附件由 _extract_files_from_item 扫 HTML
  # --------------------------------------------------------------------------
  ggzyfw_fujian_policies:
    name: "福建省公共资源交易平台-政策法规"
    site_url: "https://ggzyfw.fujian.gov.cn/"
    category: policy
    enabled: true
    detect_enabled: true
    detect_interval: 300
    detect_max_interval: 3600
    transport:
      type: encrypted_api
      engine: requests
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
        Content-Type: "application/json;charset=UTF-8"
        Origin: "https://ggzyfw.fujian.gov.cn"
        Referer: "https://ggzyfw.fujian.gov.cn/"
      encryption:
        algorithm: aes_256_cbc
        key: "EB444973714E4A40876CE66BE45D5930"
        iv: "B5A8904209931867"
        key_encoding: utf8
        field: "Data"
        encoding: utf-8
      signing:
        algorithm: md5
        secret: "B3978D054A72A7002063637CCDF6B2E5"
        header_name: "portal-sign"
      verify_ssl: false
      timeout: 30
    listing:
      url: "https://ggzyfw.fujian.gov.cn/FwPortalApi/Article/PageList"
      method: POST
      body_type: json
      params:
        type: "92,93,94,96,97,98,922"
        timeType: "7"
        createTime: ""
        BeginTime: "{{ 7_days_ago }} 00:00:00"
        EndTime: "{{ today }} 23:59:59"
        total: 0
    pagination:
      type: page_no
      page_param: pageNo
      page_size_param: pageSize
      page_size: 50
      start: 1
      total_field: Total
      total_pages_field: PageTotal
      items_field: Table
      max_pages: 10
    anti_crawler:
      delay_min: 1.0
      delay_max: 2.5
      max_retries: 4
      exponential_backoff: true
      max_consecutive_empty: 3
    extract:
      type: json_path
      items_path: "Table"
      fields:
        id: "ID"
        title: "TITLE"
        date: "TM"
        news_type: "TYPE"
        issuing_authority: "SOURCES"
      url_template: "https://ggzyfw.fujian.gov.cn/policies/detail?id={ID}&type={TYPE}"
    detail:
      type: api_request
      url: "https://ggzyfw.fujian.gov.cn/FwPortalApi/Article/Detail"
      method: POST
      body_type: json
      params:
        id: "{id}"
        type: "{news_type}"
      content_field: "CONTENTS"
    format:
      parser_id: "naive"
      upload_batch_size: 10

