  # Source: https://www.zhangzhou.gov.cn/cms/html/zzsrmzf/jdhy1/index.html
  #   本市政策解读(bszcjd) / 图说图解(tstj) / 媒体解读(jdbd) /
  #   广播解读(gbjd) / 动漫及H5解读(dmjh5jd) / 视频解读(spjd) /
  #   会议解读(hytj) / 新闻发布会(xwfbh) / 回应关切(hygq)
  # 列表: TRS CMS 静态 HTML, sitemanage 分页
  # 详情页: /cms/html/zzsrmzf/YYYY-MM-DD/XXXX.html
  # 反爬: 常规 UA + Referer，无验证码/SPA（一级）
  # --------------------------------------------------------------------------
  zhangzhou_rmzf_jdhy:
    name: "漳州市人民政府-解读回应"
    site_url: "https://www.zhangzhou.gov.cn/cms/html/zzsrmzf/jdhy1/index.html"
    category: "漳州市人民政府-解读回应"
    enabled: true
    detect_enabled: true
    detect_interval: 3600             # 1 小时轮询
    custom_runner: "rag.svr.zhangzhou_rmzf_jdhy_crawler"
    transport:
      type: rest_api                  # 占位（实际抓取由 custom_runner 完成）
    listing:
      url: "https://www.zhangzhou.gov.cn/cms/html/zzsrmzf/jdhy1/index.html"
      method: GET
    pagination:
      type: single_page               # 占位（custom_runner 内部翻页）
    extract:
      type: css_selector
      items_path: "li"
    detail:
      type: none                      # custom_runner 内部完成详情抓取
    format:
      parser_id: "naive"
      upload_batch_size: 10

  # --------------------------------------------------------------------------
  # fujian_wwj_zwgk — 福建省文物局 · 政务公开（4 栏目聚合）
  # Source: http://wwj.wlt.fujian.gov.cn/zwgk/
  #   通知公告(tzgg) / 政策法规(zcfg) / 行政权力运行(xzqlyx) /
  #   政府信息公开专栏(zfxxgkzl)
  # CMS: TRS CMS（服务端渲染 HTML，与福建省发改委同模板）
  # 列表: div.list_base > ul > li > a[href$=".htm"] + span(日期)
  # 详情: .article_title(标题) + .article_time(来源/日期) + .TRS_Editor(正文)
  #       + .article_attachment(附件，可能为空)
  # 反爬: 无（标准政府站，常规 UA + Referer 即可，一级）
  # 分页: JavaScript 客户端分页，但只取第一页，无影响
  # URL: 相对路径 ./YYYYMM/tYYYYMMDD_ID.htm，框架自动 urljoin
  # --------------------------------------------------------------------------
  fujian_wwj_zwgk:
    name: "福建省文物局-政务公开"
    site_url: "http://wwj.wlt.fujian.gov.cn"
    category: "福建省文物局-政务公开"
    enabled: true
    detect_enabled: true
    detect_interval: 600              # 10 分钟轮询（政务公开更新频率中等）

    transport:
      type: rest_api
      engine: requests
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Referer: "http://wwj.wlt.fujian.gov.cn/zwgk/"
        Accept-Language: "zh-CN,zh;q=0.9"
      verify_ssl: false
      timeout: 30

    listing:
      url: "http://wwj.wlt.fujian.gov.cn/zwgk/tzgg/"
      method: GET

    pagination:
      type: single_page               # 只取第一页，重复触发获取当天数据

    anti_crawler:
      delay_min: 1.0
      delay_max: 2.0
      max_retries: 3
      max_consecutive_empty: 3

    extract:
      type: css_selector
      items_path: ".list_base li"     # 列表项容器（每个栏目页共享此结构）
      fields:
        title: "a@title"             # <a title="完整标题"> 属性
        url: "a@href"                # 相对路径，框架自动 urljoin 为绝对 URL
        date: "span"                 # 日期 <span>2026-07-27</span>

    detail:
      type: css_selector
      content_field: ".TRS_Editor"    # TRS CMS 标准正文容器
      metadata_css:
        title: ".article_title"                          # 详情页标题
        source: ".article_time:first-of-type"            # "来源：福建省文物局"
        publish_datetime: ".article_time:last-of-type"   # "发布时间：2026-07-27 18:43"

    format:
      parser_id: "naive"
      upload_batch_size: 10

    sections:
      - label: "tzgg"
        name: "通知公告"
        listing:
          url: "http://wwj.wlt.fujian.gov.cn/zwgk/tzgg/"
      - label: "zcfg"
        name: "政策法规"
        listing:
          url: "http://wwj.wlt.fujian.gov.cn/zwgk/zcfg/"
      - label: "xzqlyx"
        name: "行政权力运行"
        listing:
          url: "http://wwj.wlt.fujian.gov.cn/zwgk/xzqlyx/"
      - label: "zfxxgkzl"
        name: "政府信息公开专栏"
        listing:
          url: "http://wwj.wlt.fujian.gov.cn/zwgk/zfxxgkzl/"

  # ═══════════════════════════════════════════════════════════
  # 泉州市公共资源交易信息网 — 智能采集（collection writer）
  # 6 个栏目：产权交易招标/中标、工程建设招标、土地矿产、其他招标、小规模工程
  # 详情正文 API: POST getProjBulletin_project.do {projId, fileType}
  #   fileType: F001=招标公告, F004=中标公示
  #   响应: data[0].fileContent (HTML), data[0].files (附件)
  # ═══════════════════════════════════════════════════════════
  quanzhou_ggzy:
    name: "泉州市公共资源交易信息网"
    site_url: "http://ggzyjy.quanzhou.gov.cn/"
    category: tender
    enabled: true
    detect_enabled: true
    detect_interval: 600
    transport:
      type: rest_api
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Content-Type: "application/json;charset=UTF-8"
        X-Requested-With: "XMLHttpRequest"
        Referer: "http://ggzyjy.quanzhou.gov.cn/"
      verify_ssl: false
      timeout: 30
    anti_crawler:
      delay_min: 0.5
      delay_max: 1.5
      max_retries: 3
    extract:
      type: json_path
      items_path: "data.dataList"
      fields:
        id: "bltId"
        title: "bltTitle"
        date: "pubDate"
    detail:
      type: api_request
      url: "http://ggzyjy.quanzhou.gov.cn/project/getProjBulletin_project.do"
      method: POST
      body_type: json
      params:
        projId: "{id}"
        fileType: "F001"
      content_field: "data.0.fileContent"
      attachment_fields:
        - "data.0.files"
    format:
      parser_id: "naive"
      upload_batch_size: 10
    pagination:
      type: page_no
      page_param: "pageIndex"
      page_size_param: "pageSize"
      page_size: 15
      items_field: "data.dataList"
      start: 1
      max_pages: 1
    sections:
      - label: property_blt
        name: "泉州市-产权交易-招标公告"
        listing:
          url: "http://ggzyjy.quanzhou.gov.cn/property/getBltPage.do"
          method: POST
          body_type: json
          params:
            pageIndex: "{{ page }}"
            pageSize: "15"
            projType: ""
            projArea: ""
            keyword: ""
            centerId: 0
        extract:
          type: json_path
          items_path: "data.dataList"
          fields:
            id: "bltId"
            title: "bltTitle"
            date: "pubDate"
          url_template: "http://ggzyjy.quanzhou.gov.cn/project/projectInfo.do?projId={bltId}&leftIndex=1&bullId={bullId}"
        detail:
          type: api_request
          url: "http://ggzyjy.quanzhou.gov.cn/project/getProjBulletin_project.do"
          method: POST
          body_type: json
          params:
            projId: "{id}"
            fileType: "F001"
          content_field: "data.0.fileContent"
          attachment_fields:
            - "data.0.files"

      - label: property_win
        name: "泉州市-产权交易-中标公示"
        listing:
          url: "http://ggzyjy.quanzhou.gov.cn/property/getWinBltPage.do"
          method: POST
          body_type: json
          params:
            pageIndex: "{{ page }}"
            pageSize: "15"
            projType: ""
            projArea: ""
            keyword: ""
            centerId: 0
        extract:
          type: json_path
          items_path: "data.dataList"
          fields:
            id: "bltId"
            title: "bltTitle"
            date: "pubDate"
          url_template: "http://ggzyjy.quanzhou.gov.cn/project/projectInfo.do?projId={bltId}&leftIndex=3&bullId={bullId}"
        detail:
          type: api_request
          url: "http://ggzyjy.quanzhou.gov.cn/project/getProjBulletin_project.do"
          method: POST
          body_type: json
          params:
            projId: "{id}"
            fileType: "F004"
          content_field: "data.0.fileContent"
          attachment_fields:
            - "data.0.files"

      - label: project_bid
        name: "泉州市-工程建设-招标信息"
        listing:
          url: "http://ggzyjy.quanzhou.gov.cn/project/getProjPage_project.do"
          method: POST
          body_type: json
          params:
            pageIndex: "{{ page }}"
            pageSize: "10"
            classId: 0
            centerId: 0
            projNo: ""
            projName: ""
            ownerDeptName: ""
        pagination:
          type: page_no
          page_param: "pageIndex"
          page_size_param: "pageSize"
          page_size: 10
          start: 1
          max_pages: 1
        extract:
          type: json_path
          items_path: "data.dataList"
          fields:
            id: "projId"
            title: "projName"
            date: "auditDate"
          url_template: "http://ggzyjy.quanzhou.gov.cn/project/projectInfo.do?projId={projId}"
        detail:
          type: api_request
          url: "http://ggzyjy.quanzhou.gov.cn/project/getProjBulletin_project.do"
          method: POST
          body_type: json
          params:
            projId: "{id}"
            fileType: "F001"
          content_field: "data.0.fileContent"
          attachment_fields:
            - "data.0.files"

      - label: land
        name: "泉州市-土地矿产"
        listing:
          url: "http://ggzyjy.quanzhou.gov.cn/land/landBidBulletin.do"
          method: POST
          body_type: json
          params:
            pageIndex: "{{ page }}"
            pageSize: "15"
            bltType: "B001"
            keyword: ""
            centerId: 0
        extract:
          type: json_path
          items_path: "data.dataList"
          fields:
            id: "bltId"
            title: "bltTitle"
            date: "pubDate"
          url_template: "http://ggzyjy.quanzhou.gov.cn/project/projectInfo.do?projId={bltId}&leftIndex=1&bullId=undefined"
        detail:
          type: api_request
          url: "http://ggzyjy.quanzhou.gov.cn/project/getProjBulletin_project.do"
          method: POST
          body_type: json
          params:
            projId: "{id}"
            fileType: "F001"
          content_field: "data.0.fileContent"
          attachment_fields:
            - "data.0.files"

      - label: other_bid
        name: "泉州市-其他招标"
        listing:
          url: "http://ggzyjy.quanzhou.gov.cn/project/getOtherBidInfo.do"
          method: POST
          body_type: json
          params:
            pageIndex: "{{ page }}"
            pageSize: "10"
            classId: 0
            centerId: 0
            projNo: ""
            projName: ""
            ownerDeptName: ""
        pagination:
          type: page_no
          page_param: "pageIndex"
          page_size_param: "pageSize"
          page_size: 10
          start: 1
          max_pages: 1
        extract:
          type: json_path
          items_path: "data.dataList"
          fields:
            id: "projId"
            title: "projName"
            date: "auditDate"
          url_template: "http://ggzyjy.quanzhou.gov.cn/project/projectInfo.do?projId={projId}"
        detail:
          type: api_request
          url: "http://ggzyjy.quanzhou.gov.cn/project/getProjBulletin_project.do"
          method: POST
          body_type: json
          params:
            projId: "{id}"
            fileType: "F001"
          content_field: "data.0.fileContent"
          attachment_fields:
            - "data.0.files"

      - label: small_project
        name: "泉州市-小规模工程"
        listing:
          url: "http://ggzyjy.quanzhou.gov.cn/small/getDetailList.do"
          method: POST
          body_type: json
          params:
            pageIndex: "{{ page }}"
            pageSize: "15"
            noticeType: 1
            projType: ""
            keyword: ""
        extract:
          type: json_path
          items_path: "data.dataList"
          fields:
            id: "notice_id"
            title: "notice_title"
            date: "publish_time"
            url: "source_url"
        detail:
          type: inline
