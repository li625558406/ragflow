  #   (工程建设/政府采购/土地使用权/矿业权/国有产权/医疗药品/其他交易)
  #   前端类型列优先读 section_name,其次 category_label
  # 时间过滤: 由前端 trigger 注入 date_filter=today；首次回溯时全量
  # 附件: detail HTML 中的 <a href> 由 _extract_files_from_item 自动识别，
  #       AttachmentHandler 负责下载 + ZIP 解压 + 上传 KB
  # --------------------------------------------------------------------------
