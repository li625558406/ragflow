        Content-Type: "application/json;charset=UTF-8"
        Origin: "https://ggzyfw.fujian.gov.cn"
        Referer: "https://ggzyfw.fujian.gov.cn/"
      encryption:
        algorithm: aes_256_cbc
        key: "EB444973714E4A40876CE66BE45D5930"
        iv: "B5A8904209931867"
        key_encoding: utf8
        field: "Data"
        encoding: utf-8
      signing:
        algorithm: md5
        secret: "B3978D054A72A7002063637CCDF6B2E5"
        header_name: "portal-sign"
