  # --------------------------------------------------------------------------
  # ccgp_bxsearch — 中国政府采购网-采购公告搜索 (智能采集新接入, 2026-07-26)
  # Source: http://search.ccgp.gov.cn/bxsearch?searchtype=1&dbselect=bidx
  # 每日触发：date_filter=today 自动注入，只采当天发布的所有公告
  # 类型分布：招标公告/更正公告/中标公告/竞争性谈判公告 等 (由 li 内 <strong> 文本决定)
  #
  # 为什么用 spa_render 而不是 rest_api:
  #   该站点对 requests/urllib 直连做 IP 级频率限制 (返回"您的访问过于频繁"页)
  #   换用 Playwright (含浏览器指纹/cookie) 即可绕过该限速
  # 分页：gopage(N) 通过 pager 上的 a.next 链接触发 form 提交，URL 自动变成 page_index=N
  # --------------------------------------------------------------------------
  ccgp_bxsearch:
    name: "中国政府采购网-采购公告搜索"
    site_url: "http://search.ccgp.gov.cn/"
    category: bid
    enabled: true
    transport:
      type: spa_render
      engine: playwright_spa
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36"
      verify_ssl: false
      timeout: 30
      network_idle: false             # hm.baidu.com 长连接, networkidle 会超时
    listing:
      # {{ today_colon }} → YYYY:MM:DD (该站约定的时间格式)
      # {{ page }} → 页码 (page_no 分页, resolve_url 每页重新解析)
      url: "http://search.ccgp.gov.cn/bxsearch?searchtype=1&page_index={{ page }}&bidSort=&buyerName=&projectId=&pinMu=&bidType=&dbselect=bidx&kw=&start_time={{ today_colon }}&end_time={{ today_colon }}&timeType=0&displayZone=&zoneId=&pppStatus=0&agentName="
      method: GET
    pagination:
      # 用 page_no (URL 直跳 page_index=N) 而非 click_next:
      # 原因 — 详情页 fetch 复用同一 Playwright page, click_next 的列表页状态会被覆盖,
      # 导致点击下一页时 .next 选择器已不在 DOM, 提前结束分页.
      type: page_no
      page_param: "page"
      page_size: 20
      page_size_param: ""
      start: 1
      max_pages: 5                # 当天公告 ~30-80 条 → 最多 5 页 × 20 条/页
    anti_crawler:
      delay_min: 2.0
      delay_max: 4.0
      max_retries: 4
      max_consecutive_empty: 3
    extract:
      # 列表结构: ul.vT-srch-result-list-bid > li > a + p > span
      # js_extract 直接在 DOM 上遍历 li, 提取 标题/链接/日期/采购人/代理/类型/地区/品目
      type: css_selector
      items_path: "ul.vT-srch-result-list-bid li"
      js_extract: |
        () => {
          const results = [];
          const seen = new Set();
          const ul = document.querySelector("ul.vT-srch-result-list-bid");
          if (!ul) return results;
          const lis = ul.querySelectorAll("li");
          for (const li of lis) {
            const a = li.querySelector("a[href]");
            if (!a) continue;
            const url = a.href;
            if (!url || seen.has(url)) continue;
            seen.add(url);
            const title = (a.textContent || '').trim();
            const spanText = (li.querySelector("span")?.textContent || '')
              .replace(/\s+/g, ' ').trim();
            // date: 第一个 YYYY.MM.DD HH:MM:SS
            const dateMatch = spanText.match(/\d{4}\.\d{1,2}\.\d{1,2}\s+\d{1,2}:\d{2}(:\d{2})?/);
            const dateStr = dateMatch ? dateMatch[0].replace(/\./g, '-').substring(0, 19) : '';
            // buyer (采购人:xxx)
            const buyerMatch = spanText.match(/采购人[：:]\s*([^|]+)/);
            const buyer = buyerMatch ? buyerMatch[1].trim() : '';
            // agent (代理机构:xxx)
            const agentMatch = spanText.match(/代理机构[：:]\s*([^|]+)/);
            const agent = agentMatch ? agentMatch[1].trim() : '';
            // subtype: 第一个 <strong> 的文本 (招标公告/更正公告/中标公告/...)
            const strong = li.querySelector("strong");
            const subtype = strong ? (strong.textContent || '').trim() : '';
            // region: 类型后 |  地区  | 品目
            const parts = spanText.split('|').map(s => s.trim());
            let region = '';
            let category = '';
            if (parts.length >= 4) region = parts[3];
            if (parts.length >= 5) category = parts[4];
            // id from URL: tYYYYMMDD_NNNNNN.htm → NNNNNN
            const idMatch = url.match(/t\d{8}_(\d+)\.htm/);
            const id = idMatch ? idMatch[1] : url;
            results.push({
              title: title,
              url: url,
              date: dateStr,
              id: id,
              buyer_name: buyer,
              agency_name: agent,
              announcement_type: subtype,
              region: region,
              procurement_category: category,
              section_name: subtype || '信息公告',
              news_type: subtype,
            });
          }
          return results;
        }
    detail:
      type: css_selector
      # 详情页主正文容器
      content_field: ".vF_detail_content"
      # 元数据 (来源/发布时间/ArticleTitle 等) 已在 <meta> 标签, 通过 metadata_js 提取
      metadata_js: |
        () => {
          const result = {};
          const getMeta = (name) => {
            const m = document.querySelector(`meta[name="${name}"]`);
            return m ? (m.getAttribute('content') || '').trim() : '';
          };
          const articleTitle = getMeta('ArticleTitle');
          const pubDate = getMeta('PubDate');
          const source = getMeta('ContentSource');
          if (articleTitle) result.detail_title = articleTitle;
          if (pubDate) result.publish_datetime = pubDate;
          if (source) result.source_org = source;
          // 提取附件 (PDF/DOC/ZIP 等), 附件 handler 会自动从 content_field 扫 <a>,
          // 这里冗余记录便于排查
          const atts = [];
          for (const a of document.querySelectorAll('a[href]')) {
            const h = a.href;
            if (/\.(zip|rar|7z|pdf|doc|docx|xls|xlsx|ppt|pptx|wps|et|dps)(\?|$)/i.test(h)) {
              atts.push({file_name: a.textContent.trim(), file_url: h});
            }
          }
          if (atts.length) result.ccgp_attachments = atts;
          return result;
        }
    format:
      parser_id: "naive"
      upload_batch_size: 10

