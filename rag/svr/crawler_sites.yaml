  #     资质管理               /xxgk/zzgl/
  #     人大建议和政协提案办理 /xxgk/rdjyhzxtabl/
  #     数据图解（统计信息）   /xxgk/tjxx/         （正文为 <img>，附件下载后由 KB OCR）
  # 列表 HTML：SSR 静态 + Avalon 控件（barrier-free-idx/leaf 由 JS 注入）
  #           ul/li 包含 a[href*="tYYYYMMDD_ID.htm"][title] + .longdate
  # 详情 HTML：.myzj_con > h1.xl_tit（标题）+ .xl_tit2_l（日期/来源/浏览量）+ #detailCont（正文）
  #           正文内嵌 <img src> （数据图解）和 <a href="*.pdf|docx|...">（附件）
  #           由 engine._extract_files_from_item 自动扫描；ZIP/RAR 由 attachment_handler 解压
  # 反爬：常规 UA + Referer；探测无指纹/验证码/IP 限速；SSR 已渲染，spa_render 主要用于 js_extract。
  # 去重：crawler_result 主键 upsert (id=md5(site_id|source_url))；
  #       trigger 首次回溯全量、后续注入 date_filter=today 仅采当天（设计文档 §11.1）。
  # --------------------------------------------------------------------------
  fujian_zjt_xxgk:
    name: "福建省住建厅-政务公开"
    site_url: "https://zjt.fujian.gov.cn"
    category: news
    enabled: true
    detect_enabled: true
    detect_interval: 600              # 10 分钟轮询
    transport:
      type: spa_render                # js_extract 需 spa_render 适配器（rest_api 不支持）
      engine: playwright_spa
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Referer: "https://zjt.fujian.gov.cn/xxgk/"
        Accept-Language: "zh-CN,zh;q=0.9"
      verify_ssl: false
      timeout: 30
      network_idle: false             # gov 站长连接使 networkidle 永不触发
    anti_crawler:
      delay_min: 1.0
      delay_max: 2.0
      max_retries: 3
      empty_page_stop: 1
    pagination:
      type: single_page              # 栏目首页列表，一次返回全部（无翻页 UI）
    extract:
      type: css_selector
      items_path: "body"             # 占位（实际由 js_extract 全页扫描）
      js_extract: |
        () => {
          const results = [];
          const seen = new Set();
          // 全页扫描所有 zjt.fujian.gov.cn 域下的 tYYYYMMDD_<id>.htm 详情链接
          const linkPattern = /\/(?:xxgk|zfxxgkzl|gzdt|bmdt|wjzx|jdhy|gzcy)[^?]*?\/t\d{8}_\d+\.htm$/i;
          const anchors = document.querySelectorAll('a[href]');
          for (const a of anchors) {
            let href = a.href || '';
            if (!href) continue;
            try { href = new URL(href, location.href).href; } catch (e) { continue; }
            if (!linkPattern.test(href)) continue;
            if (!/zjt\.fujian\.gov\.cn/i.test(href)) continue;
            if (seen.has(href)) continue;

            const title = (a.getAttribute('title') || (a.textContent || '').trim() || '').trim();
            if (!title || title.length < 4) continue;

            // 找最近的 .longdate（YYYY-MM-DD）或 .shortdate（MM-DD）取日期
            let dateStr = '';
            let parent = a.closest('li, tr, div');
            for (let i = 0; i < 3 && parent && !dateStr; i++) {
              const ld = parent.querySelector('.longdate, .shortdate, .shortdate2, span.date, em.date');
              if (ld) dateStr = (ld.textContent || '').replace(/[\[\]]/g, '').trim();
              parent = parent.parentElement;
            }
            // URL 兜底：t20260727_7192536.htm → 2026-07-27
            if (!dateStr) {
              const m = href.match(/t(\d{4})(\d{2})(\d{2})_\d+\.htm/i);
              if (m) dateStr = `${m[1]}-${m[2]}-${m[3]}`;
            }
            // shortdate MM-DD → 补当前年份（防止跨年场景丢日期）
            if (dateStr && /^\d{2}-\d{2}$/.test(dateStr)) {
              const year = (new Date()).getFullYear();
              dateStr = `${year}-${dateStr}`;
            }

            // docid：URL 末尾数字（主键来源），稳定唯一
            const docidMatch = href.match(/t\d{8}_(\d+)\.htm/i);
            const docid = docidMatch ? docidMatch[1] : '';

            seen.add(href);
            results.push({
              id: docid || href,             // 主键（dedup 用）
              docid: docid,
              title: title,
              url: href,
              date: dateStr,
              issuing_authority: '福建省住房和城乡建设厅',
            });
          }
          return results;
        }
    detail:
      type: css_selector
      content_field: "#detailCont"
      metadata_js: |
        () => {
          const result = {
            publish_datetime: '',
            source: '',
            doc_number: '',
            issuing_authority: '福建省住房和城乡建设厅',
            topic_category: '',
            browse_count: '',
            files: [],
            images: [],
          };
          // 布局 A: .xl_tit2_l 内含 日期：/来源：/浏览量：（旧版详情页）
          const meta = document.querySelector('.xl_tit2_l');
          if (meta) {
            const txt = meta.textContent || '';
            const tm = txt.match(/日期[:：]\s*(\d{4}-\d{1,2}-\d{1,2}(?:\s+\d{1,2}:\d{1,2})?)/);
            if (tm) result.publish_datetime = tm[1].trim();
            const sm = txt.match(/来源[:：]\s*([^\s\u4e00-\u9fa5]?[\u4e00-\u9fa5A-Za-z（）()][^\n]{0,40})/);
            if (sm) result.source = sm[1].trim();
            const bc = txt.match(/浏览量[:：]\s*(\d+)/);
            if (bc) result.browse_count = bc[1];
          }
          // 布局 B: TRS CMS .trt-row 行（新版详情页）— 索引号/发文字号/发布机构/生成日期
          // + .article_source 来源 / .article_time 发布时间
          if (!result.publish_datetime || !result.source || !result.doc_number) {
            const trtTxt = (document.querySelector('.trt-row') || {}).textContent || '';
            if (!result.doc_number) {
              // textContent 折叠后，发文字号值与下一个字段（发布机构）在同一行流。
              // 用 [\s\S] 跨行匹配直到下一字段标签。
              const dn = trtTxt.match(/发文字号[:：]\s*([\s\S]{1,60}?)(?:发布机构|生成日期|索引号|有效|来源|标题)/);
              if (dn) result.doc_number = dn[1].replace(/<[^>]+>/g, '').trim();
            }
            if (!result.publish_datetime) {
              const tm2 = trtTxt.match(/生成日期[:：]\s*(\d{4}-\d{1,2}-\d{1,2})/);
              if (tm2) result.publish_datetime = tm2[1].trim();
            }
            const ia = trtTxt.match(/发布机构[:：]\s*([\u4e00-\u9fa5A-Za-z（）()][^\n]{0,40})/);
            if (ia && ia[1].trim()) result.issuing_authority = ia[1].trim();
          }
          if (!result.publish_datetime) {
            const at = document.querySelector('.article_time, .bf-pass');
            if (at) {
              const tm3 = (at.textContent || '').match(/(\d{4}-\d{1,2}-\d{1,2}(?:\s+\d{1,2}:\d{1,2})?)/);
              if (tm3) result.publish_datetime = tm3[1].trim();
            }
          }
          if (!result.source) {
            const as = document.querySelector('.article_source');
            if (as) {
              const sm2 = (as.textContent || '').match(/来源[:：]\s*([\u4e00-\u9fa5A-Za-z（）()][^\n]{0,40})/);
              if (sm2) result.source = sm2[1].trim();
            }
          }
          // 面包屑（topic_category）
          const crumbs = document.querySelectorAll('.crumb a, .CurrChnlCls, .xl_bread a');
          if (crumbs.length) {
            result.topic_category = (crumbs[crumbs.length - 1].textContent || '').trim();
          }
          // 正文内的附件（PDF/DOC/ZIP/...），engine 会再扫一次，这里同步落 extracted_json
          const detail = document.querySelector('#detailCont');
          if (detail) {
            const fileExt = /\.(pdf|docx?|xlsx?|pptx?|zip|rar|7z|ofd|wps|et|dps)(\?|$)/i;
            const p0Pattern = /P0\d{15,}/i;
            detail.querySelectorAll('a[href]').forEach(a => {
              const h = a.href || '';
              if (!h) return;
              if (!fileExt.test(h) && !p0Pattern.test(h)) return;
              result.files.push({
                file_name: (a.textContent || '').trim() || h.split('/').pop(),
                file_url: h,
              });
            });
            // 数据图解：正文是 <img src>（用户需求 #4 / #10 OCR 解析图片）
            detail.querySelectorAll('img[src]').forEach(img => {
              const src = img.src || '';
              if (!src) return;
              // 过滤 logo / 系统图标（< 100x100 由样式 width/height 蔽之）
              const w = parseInt(img.getAttribute('width') || '0', 10);
              const h = parseInt(img.getAttribute('height') || '0', 10);
              if (w && w < 100) return;
              if (h && h < 100) return;
              if (/logo|icon|spacer|blank/i.test(src)) return;
              result.images.push({
                file_name: (img.getAttribute('alt') || '').trim() || src.split('/').pop(),
                file_url: src,
              });
            });
          }
          // 发文字号：从正文首位匹配「闽〔YYYY〕N号」「闽XX〔YYYY〕N号」等
          const bodyText = (detail ? detail.textContent : '').slice(0, 800);
          const dn = bodyText.match(/(?:闽|国|住建|建设|发改|财政|交通)[\u4e00-\u9fa5]{0,15}〔\d{4}〕\s*\d+\s*号/);
          if (dn) result.doc_number = dn[0].trim();
          return result;
        }
    format:
      parser_id: "naive"
      upload_batch_size: 5
      template: |
        # {{ title }}

        **栏目:** {{ section_name }}
        **发布机构:** {{ issuing_authority }}
        **发布日期:** {{ publish_datetime }}
        **发文字号:** {{ doc_number }}
        **来源:** {{ source }}
        **原文链接:** {{ url }}

        {{ content }}
