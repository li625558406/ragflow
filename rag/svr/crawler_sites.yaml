  # --------------------------------------------------------------------------
  # zjfw_zhangzhou_zxjx — 漳州市工程项目网上中介服务平台-通知公告
  # Target: http://zjfw.zhangzhou.gov.cn/imng/zjfw/index/serviceGuide/serviceGuide?name=ZXJX
  # List API: POST /imng/api-v2/fujian.zhangzhougaoxin.app.icity.policy.PolicyCmd/getList
  #           body: {"type":"ZXJX","TITLE@like":"","start":0,"limit":10}
  # Adapter: spa_render — api-v2 REST 端点需 s/t 客户端签名 token，导航到 SPA
  #          页面后由前端 JS 自动发起 XHR，_setup_api_capture 拦截响应。
  # anti_crawler: 站点无强反爬；签名 token 由 SPA 自动生成，无需逆向。
  # --------------------------------------------------------------------------
  zjfw_zhangzhou_zxjx:
    name: "漳州市工程项目网上中介服务平台-通知公告"
    site_url: "http://zjfw.zhangzhou.gov.cn"
    category: news                        # 通知公告 → 新闻资讯；section_name 覆盖前端「类型」列
    enabled: true
    detect_enabled: true                  # ★ 探测器自动增量（对齐 §15.6 crawler_task 数据源）
    detect_interval: 600
    transport:
      type: spa_render
      engine: playwright_spa
      network_idle: false                 # 政府站 analytics 让 networkidle 永不空闲
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36"
        Accept: "application/json, text/plain, */*"
      verify_ssl: false
      timeout: 60
    listing:
      url: "http://zjfw.zhangzhou.gov.cn/imng/zjfw/index/serviceGuide/serviceGuide?name=ZXJX"
      method: GET
    pagination:
      type: single_page                   # 仅抓首页（用户需求 #4：首页全量 + 后续按 date_filter=today）
      items_field: "data"                 # XHR 响应 {"total":N,"data":[...]}
    anti_crawler:
      delay_min: 1.5
      delay_max: 3.0
      max_retries: 3
    extract:
      type: json_path
      items_path: "data"
      fields:
        id:    "ID"
        title: "TITLE"
        date:  "DISPLAYTIME"              # "YYYY-MM-DD" 或 "YYYY-MM-DD HH:mm:ss"
        # 扩展字段（落入 extracted_json + collection_*_ext 视 category 决定）
        issuing_authority: "SOURCE"       # 信息来源（多为空，metadata_js 兜底）
        topic_category:    "TYPE_NAME"    # 主题分类
        doc_number:        "ATTACHMENT_NAME"  # 附件名常含文号
      # 详情 URL：tagName=通知公告 (UTF-8 双重 percent-encode)，typeName=ZXJX
      # 服务端实际接收 ?id=xxx&tagName=%E9%80%9A%E7%9F%A5%E5%85%AC%E5%91%8A&typeName=ZXJX
      # 双重编码：% → %25，浏览器解码一次后保留单次编码传给服务端
      url_template: "http://zjfw.zhangzhou.gov.cn/imng/zjfw/index/policy/policyDetail_view?id={ID}&tagName=%25E9%2580%259A%25E7%259F%25A5%25E5%2585%25AC%25E5%2591%258A&typeName=ZXJX"
    sections:
      - label: "zxjx"
        name: "漳州市-通知公告"            # ★ 前端「类型」列展示 (engine 注入 section_name 到 extracted_json)
    detail:
      type: css_selector
      content_field: "#policies_regulations_tab"   # 详情主容器：header + meta + 正文 + 附件
      metadata_js: |
        () => {
          const result = {};
          // 发布时间 / 信息来源 — 元数据 <li> 标签
          document.querySelectorAll('li, span, p').forEach(el => {
            const t = (el.textContent || '').trim();
            const m = t.match(/发布时间[：:]\s*([\d\-/: ]+)/);
            if (m && !result.publish_datetime) result.publish_datetime = m[1].trim();
            const m2 = t.match(/信息来源[：:]\s*(.+)/);
            if (m2 && !result.issuing_authority) result.issuing_authority = m2[1].trim();
          });
          // 附件：抓所有文档/压缩包链接（含 downloadagent 路径）
          // 压缩包由 AttachmentHandler 下载后自动解压上传 KB
          const files = [];
          document.querySelectorAll('a').forEach(a => {
            const href = a.href || '';
            const name = (a.textContent || '').trim();
            if (/\.(pdf|docx?|xlsx?|zip|rar|7z)(\?|$)/i.test(href) || href.includes('downloadagent')) {
              files.push({ file_url: href, file_name: name || href.split('/').pop() });
            }
          });
          if (files.length) result.files = files;
          // 文号兜底解析 "漳建审改〔2024〕3号" / "闽建[2024]3号" 等
          const allText = document.body.innerText || '';
          const dn = allText.match(/(?:漳建|闽建|国发|国办发|政办|建审改|建设|市政府|省)?〔\s*\d{4}\s*〕\s*\d+\s*号|[\u4e00-\u9fa5]{2,10}\[\d{4}\]\d+\s*号/);
          if (dn) result.doc_number = dn[0];
          return result;
        }
    format:
      parser_id: "naive"
      template: |
        # {{ title }}

        **发布时间:** {{ date }}
        **来源:** 漳州市工程项目网上中介服务平台
        **原文链接:** {{ url }}

        {{ content }}
      upload_batch_size: 5

