          method: GET
      - label: "interface"
        name: "接口规范"
        listing:
          url: "https://ggzyjd.fj.gov.cn/policies/list/?type=接口规范&title="
          method: GET
    pagination:
      type: click_next
      next_page_selector: ".el-pagination .btn-next:not(.disabled)"
      max_pages: 5                    # 单日数据量少, 5页足够覆盖
      items_field: "data.Rows"        # API 响应数据路径 (用于 total 读取)
      total_field: "data.Total"
    anti_crawler:
      delay_min: 2.0
      delay_max: 4.0
      max_retries: 4
      max_consecutive_empty: 3
    extract:
      # 列表 DOM: div.list-list > div.list-item > a.title + 尾部日期文本
      # BS4 无法取到 <a> 自身的 textContent (不含子元素), 用 js_extract 直接提取
      # (与旧脚本 ggzyjd_policies_crawler.py::_extract_list_items 一致)
      type: css_selector
      items_path: "div.list-list div.list-item"
      js_extract: |
        () => {
          const results = [];
          const seen = new Set();
          const items = document.querySelectorAll('div.list-list div.list-item');
          for (const item of items) {
            const a = item.querySelector('a.title');
            if (!a || !a.href) continue;
            const href = a.href;
            const title = (a.textContent || '').trim();
            if (!title || title.length < 2) continue;
            if (seen.has(href)) continue;
            seen.add(href);

            // Date: 在父容器 div.list-item 的文本尾部 (标题+空格+YYYY-MM-DD)
            const parentText = (item.textContent || '').trim();
            const dateMatches = parentText.match(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/g);
            const dateStr = dateMatches ? dateMatches[dateMatches.length - 1] : '';

            // ID: 从 URL query param 提取
            let artId = '';
            try { const url = new URL(href); artId = url.searchParams.get('id') || ''; } catch(e) {}

            results.push({
              title: title,
              url: href,
              date: dateStr,
              id: artId || '',
            });
          }
          return results;
        }
    detail:
      type: css_selector
      content_field: ".new-detail .content"
      # 详情页结构: .new-detail > .header (h1 + .info 元数据) + .content (正文)
      # content_field 改为 .content 只抓正文, 元数据由 metadata_js 提取为结构化字段
      metadata_js: |
        () => {
          const result = {};
          const spans = document.querySelectorAll('.new-detail .info span');
          for (const span of spans) {
            const label = span.querySelector('label');
            if (!label) continue;
            const key = label.textContent.replace(/[:：]/g, '').trim();
            const value = span.textContent.replace(label.textContent, '').trim();
            if (key === '信息来源') result.issuing_authority = value;
            if (key === '发布日期') result.publish_datetime = value;
          }
          return result;
        }
    format:
      parser_id: "naive"
      upload_batch_size: 10

