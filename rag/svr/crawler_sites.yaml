  # --------------------------------------------------------------------------
  # zycg_zdfg — 中央政府采购网-政策法规 (FreeCMS 静态 HTML, 2 sections)
  # Listing 1: /zygjjgzfcgzx/zdfg/index.html   制度法规栏目
  # Listing 2: /zygjjgzfcgzfcgzx/czbfg/index.html  财政部法规栏目
  # Detail  : /zygjjgzfcgzx/{channel}/info/YYYY/ID.html
  # Files   : /freecms/upload/{uuid}/{date}/{filename}.{doc|docx|pdf|...}
  # Old script: zycg_zdfg_crawler.py (FreeCMS, no JS, URLEncoder not needed)
  # Note    : 列表 <li><a class=titleHiding href title><span>title</span></a>
  #           + <span style="float:right;color:#999;">YYYY-MM-DD</span>
  #           详情页 .info-content 容器 + <a href> 附件链 (engine 自动扫描)
  # Sections 共享一份 extract/detail 配置, 仅 listing.url 不同。
  # --------------------------------------------------------------------------
  zycg_zdfg:
    name: "中央政府采购网-政策法规"
    site_url: "https://www.zycg.gov.cn/"
    category: policy                         # ★ 写 crawler_result + collection_policy_ext
    enabled: true
    detect_enabled: false                    # 服务器IP被屏蔽, 探测器无法探测, 改由本地Win任务每日09:00执行
    detect_interval: 600                     # 政策类更新慢, 10 分钟一轮
    transport:
      type: rest_api
      engine: requests
      verify_ssl: true
      timeout: 30
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36"
        Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
        Accept-Language: "zh-CN,zh;q=0.9"
    listing:
      url: "https://www.zycg.gov.cn/freecms/site/zygjjgzfcgzx/zdfg/index.html"
      method: GET
    pagination:
      type: single_page                      # 仅抓 index.html; 历史存量由首次回溯一次性消化, 后续 trigger 走 today 过滤
    anti_crawler:
      delay_min: 1.0
      delay_max: 2.0
      max_retries: 3
      max_consecutive_empty: 2
    extract:
      # 列表 li 结构: a.titleHiding[href][title] > span 标题, 同级 span 日期
      # BS4 取 <a> 自身 text 不可靠 (含子元素), 用 js_extract 直接遍历
      type: css_selector
      items_path: "li"
      js_extract: |
        () => {
          const results = [];
          const seen = new Set();
          // 只匹配info详情链接, 跳过导航/频道切换
          const anchors = document.querySelectorAll('li a.titleHiding[href*="/info/"][href$=".html"]');
          for (const a of anchors) {
            const href = a.href || a.getAttribute('href') || '';
            if (!href) continue;
            const title = (a.getAttribute('title') || a.textContent || '').trim();
            if (!title || title.length < 3) continue;
            if (seen.has(href)) continue;
            seen.add(href);
            // 日期在同级 <span style="color:#999;"> 内
            const li = a.closest('li');
            let date = '';
            if (li) {
              const span = li.querySelector('span[style*="color: #999"], span[style*="color:#999"]');
              if (span) date = (span.textContent || '').trim();
            }
            // ID 从 URL 提取 (info/YYYY/XXXXX.html → YYYY/XXXXX)
            let artId = '';
            const m = href.match(/\/info\/(\d{4}\/[^\/]+)\.html/);
            if (m) artId = m[1];
            results.push({
              id: artId,
              title: title,
              url: href,
              date: date,
            });
          }
          return results;
        }
    detail:
      type: css_selector
      content_field: ".info-content"         # 详情正文容器 (FreeCMS 标准结构)
      # metadata_js 仅 spa_render 支持; rest_api 走 _fetch_detail_css 不解析
      # 政策扩展字段 (doc_number/issuing_authority/...) 留空, 由 LLM 解析或后续补
    format:
      parser_id: "naive"
      upload_batch_size: 10
    sections:
      - label: "zdfg"
        name: "制度法规"
        listing:
          url: "https://www.zycg.gov.cn/freecms/site/zygjjgzfcgzx/zdfg/index.html"
          method: GET
        pagination:
          type: single_page
      - label: "czbfg"
        name: "财政部法规"
        listing:
          url: "https://www.zycg.gov.cn/freecms/site/zygjjgzfcgzx/czbfg/index.html"
          method: GET
        pagination:
          type: single_page

