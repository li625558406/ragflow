  # ── ggzy_quanguo — 全国公共资源交易平台 · 交易公开（当日全量） ──
  # Source: https://www.ggzy.gov.cn/deal/dealList.html
  # API:    POST /information/pubTradingInfo/getTradList  (form: SOURCE_TYPE/DEAL_TIME/TIMEBEGIN/TIMEEND/PAGENUMBER)
  # Detail: API 列表返回的是 '/deal/html/a/...' 摘要页（含 4 个子栏目 tab）；
  #         真正的正文在 '/deal/html/b/...' 兄弟路径下，容器 #mycontent；
  #         b 页同时含"原文链接地址"指向省级原始平台。
  # 通过 extract.url_search/url_replace 把 a 链接改写成 b 链接后用于详情抓取。
  # Category: bid（招标标讯），扩展字段 province/business_type/information_type 写入 extracted_json。
  # ─────────────────────────────────────────────────────────────────
  ggzy_quanguo:
    name: "全国公共资源交易平台-交易公开"
    site_url: "https://www.ggzy.gov.cn"
    category: bid
    enabled: true
    transport:
      type: rest_api
      engine: requests
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Content-Type: "application/x-www-form-urlencoded"
        Accept: "application/json, text/plain, */*"
        Origin: "https://www.ggzy.gov.cn"
        Referer: "https://www.ggzy.gov.cn/deal/dealList.html"
      verify_ssl: false
      timeout: 30
    listing:
      url: "https://www.ggzy.gov.cn/information/pubTradingInfo/getTradList"
      method: POST
      body_type: form
      params:
        SOURCE_TYPE: "1"
        DEAL_TIME: "01"
        TIMEBEGIN: "{{ today }}"
        TIMEEND: "{{ today }}"
        PAGENUMBER: "{{ page }}"
    pagination:
      type: page_no
      page_param: "PAGENUMBER"
      page_size: 20
      # 注意: 不能把 page_size_param 也设成 PAGENUMBER（与 page_param 重名会让
      # paginator._build_page_params 中 size 把 page 覆盖，每次请求都是 PAGENUMBER=20）。
      # 该 API 不消费 size 参数（服务端固定 20 条/页），给个被忽略的名字即可。
      page_size_param: "ROWS_IGNORED"
      start: 1
      max_pages: 50                    # API 上限 total=1000, pages=50
      total_field: "data.total"
      total_pages_field: "data.pages"
    anti_crawler:
      delay_min: 1.5
      delay_max: 3.0
      max_retries: 3
      max_consecutive_empty: 2
    extract:
      type: json_path
      items_path: "data.records"
      # 把列表返回的 'a' 摘要 URL 改写为 'b' 正文 URL（同 id/同 path）
      url_search: "/deal/html/a/"
      url_replace: "/deal/html/b/"
      fields:
        id: "id"
        title: "title"
        url: "url"
        date: "publishTime"
        # ── 扩展结构化字段（写入 extracted_json，前端可按 province 过滤） ──
        province: "provinceText"
        province_code: "province"
        city: "cityText"
        city_code: "city"
        business_type: "businessTypeText"
        information_type: "informationTypeText"
        information_code: "informationType"
        industry_type: "industryTypeText"
        source_platform: "transactionSourcesPlatformText"
        tender_project_code: "tenderProjectCode"
    detail:
      type: css_selector
      content_field: "#mycontent"
    format:
      parser_id: "naive"
      upload_batch_size: 5
      template: |
        # {{ title }}

        **发布日期:** {{ date }}
        **省份:** {{ province }}
        **业务类型:** {{ business_type }}
        **信息类型:** {{ information_type }}
        **行业类型:** {{ industry_type }}
        **信息来源:** {{ source_platform }}
        **原文链接:** {{ url }}

        {{ content }}

