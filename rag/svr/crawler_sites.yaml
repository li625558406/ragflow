  # ==========================================================================
  # 福建省政府采购网 - 公告信息（省级 + 9 地级市）  category=announcement
  # 接口：/gpcms/rest/web/v2/info/selectInfoForIndex（需 verifyCode 验证码）
  # 验证码：/gpcms/rest/web/v2/index/getVerify（ddddocr OCR，spa_render 内置）
  # 详情：/gpcms/rest/web/v2/info/getInfoById（data.content 正文 + data.attchList 附件）
  # 架构：spa_render + vue_http（绕过 nsssjss 签名）+ captcha(ocr)
  # siteId 全省统一 d36a6e8b-4363-4b52-a00b-79ca47033923；regionCode 按地市
  # channel 统一 f582600e-065d-4f35-8966-48a33fa93863（公告信息频道）
  # 附件 URL 带 accessCode 自包含令牌，AttachmentHandler 裸 requests 可下载
  # ==========================================================================
  fujian_zfcg_prov:
    name: "福建省政府采购网-公告信息（省级）"
    site_url: "https://zfcg.czt.fujian.gov.cn"
    category: announcement
    enabled: true
    detect_enabled: true
    detect_interval: 600
    transport:
      type: spa_render
      engine: playwright_spa
      vue_http: true
      network_idle: false
      captcha: { type: ocr }
      verify_ssl: false
      timeout: 90
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
    listing:
      url: "https://zfcg.czt.fujian.gov.cn/gpcms/rest/web/v2/info/selectInfoForIndex"
      method: GET
      params:
        currPage: "{{ page }}"
        pageSize: "{{ page_size }}"
        siteId: "d36a6e8b-4363-4b52-a00b-79ca47033923"
        channel: "f582600e-065d-4f35-8966-48a33fa93863"
        noticeType: "59,001056,00101,001062,001051,001031,001032,001021,001022,001023,001024,001025,001026,001029,001004,001006,001054,001033,00105K"
        regionCode: "350001"
        operationStartTime: "{{ today }} 00:00:00"
        operationEndTime: "{{ today }} 23:59:59"
        organizationForm: "!4"
        selectTimeName: ""
    pagination:
      type: page_no
      page_param: currPage
      page_size_param: pageSize
      page_size: 20
      start: 1
      max_pages: 10
      items_field: "data.rows"
      total_field: "data.total"
    anti_crawler:
      delay_min: 2.0
      delay_max: 4.0
      max_retries: 4
      max_consecutive_empty: 3
    extract:
      type: json_path
      items_path: "data.rows"
      fields:
        id: "id"
        title: "title"
        date: "noticeTime"
        url: "url"
        openTenderTime: "openTenderTime"
        regionName: "regionName"
        purchaser: "purchaser"
        agency: "agency"
        openTenderCode: "openTenderCode"
        budget: "budget"
        purchaseManner: "purchaseManner"
        catalogueNameList: "catalogueNameList"
        noticeTypeName: "noticeTypeName"
        publishTime: "publishTime"
        planId: "planId"
        channel: "channel"
      url_template: "https://zfcg.czt.fujian.gov.cn/maincms-web/articleDetail?id={noticeId}"
    detail:
      type: api_request
      url: "https://zfcg.czt.fujian.gov.cn/gpcms/rest/web/v2/info/getInfoById"
      method: GET
      params:
        id: "{id}"
        # channel + siteId auto-injected by spa_render vue_http (see
        # _fetch_detail_via_vue_http). planId removed: listing API does not
        # return it, causing literal "{planId}" to be sent → 4009 验签失败.
      content_field: "data.content"
    sections:
      - label: ggnr
        name: "公告信息-省级"

