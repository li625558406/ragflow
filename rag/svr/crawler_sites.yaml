  # --------------------------------------------------------------------------
  # zjt_jdhy — 福建省住房和城乡建设厅 · 解读回应 (TRS WCM + Avalon MVVM SPA)
  # Source: https://zjt.fujian.gov.cn/jdhy/
  #   回应关切  /jdhy/hygq/   (Avalon SSR, ~70 条/页)
  #   政策解读  /jdhy/zcjd/   (Avalon SSR，混合 4 个子栏目)
  #     子栏目（按 URL 子目录区分）:
  #       wz/   文字解读
  #       tj/   图解读解   ← 图文一体，KB 端 OCR 处理
  #       mtbd/ 媒体报道
  #       ft/   访谈
  # 详情页结构：
  #   <h1 class="xl_tit">标题</h1> +
  #   .xl_con1.detailCont 正文容器（含 TRS_Editor 或微信迁移的 <html> 片段）+
  #   .myzj_xl_list 附件区 +
  #   meta[PubDate|ContentSource|ArticleTitle|ColumnName|DocId|ColumnType] 元数据
  # 反爬：常规 UA + Referer 即可，无加密/验证码；Avalon SSR 已含可采列表
  # --------------------------------------------------------------------------
  zjt_jdhy:
    name: "福建省住建厅-解读回应"
    site_url: "https://zjt.fujian.gov.cn/jdhy/"
    category: policy
    enabled: true
    detect_enabled: true
    detect_interval: 600              # 10 分钟轮询一次
    transport:
      type: spa_render
      engine: playwright_spa
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Referer: "https://zjt.fujian.gov.cn/jdhy/"
        Accept-Language: "zh-CN,zh;q=0.9"
      verify_ssl: false
      timeout: 30
      network_idle: false            # gov 站长连接使 networkidle 永不触发
    pagination:
      type: single_page              # 每栏目首页列表（trigger 默认 date_filter=today）
    anti_crawler:
      delay_min: 1.5
      delay_max: 3.0
      max_retries: 3
      max_consecutive_empty: 3
    extract:
      type: css_selector
      items_path: "ul li"            # 兜底选择器，实际靠 js_extract 出数据
      fields:
        id:    "a@href"
        title: "a@title"
        url:   "a@href"
        date:  "span"
      # 父级统一 js_extract：按 URL 路径（hygq / zcjd）分发主栏目，
      # 按 zcjd 子目录（wz/tj/mtbd/ft）分子栏目。section.js_extract 会被
      # spa_render adapter 忽略，必须放在父级 extract。
      js_extract: |
        () => {
          const results = [];
          const seen = new Set();
          const path = location.pathname;
          let mainSection = '解读回应';
          if (/\/hygq\//i.test(path)) mainSection = '回应关切';
          else if (/\/zcjd\//i.test(path)) mainSection = '政策解读';
          const SUB = {
            wz:   '文字解读',
            tj:   '图解读解',
            mtbd: '媒体报道',
            ft:   '访谈',
          };
          // 列表项可能出现在 .jdhy_list .bd / ul.changeWj / .gl_list1 ul
          const lis = document.querySelectorAll(
            '.jdhy_list .bd li, ul.changeWj li, .gl_list1 li, ul li'
          );
          for (const li of lis) {
            const a = li.querySelector('a[href]');
            if (!a) continue;
            let href = a.href || a.getAttribute('href') || '';
            if (!href) continue;
            try { href = new URL(href, location.href).href; } catch (e) { continue; }
            // 严格限制：仅采 zjt.fujian.gov.cn/jdhy/ 下的 .htm
            if (!/zjt\.fujian\.gov\.cn\/jdhy\/.*\.htm/i.test(href)) continue;
            const title = (a.getAttribute('title') || a.textContent || '').trim();
            if (!title || title.length < 4) continue;
            if (seen.has(href)) continue;
            seen.add(href);
            const span = li.querySelector('span');
            let date = '';
            if (span) {
              const txt = (span.textContent || '').trim();
              if (/\d{4}[-./]\d{1,2}[-./]\d{1,2}/.test(txt)) date = txt;
            }
            const m = href.match(/t(\d{8})_(\d+)\.htm/i);
            // 子栏目（仅 zcjd 有子目录 wz/tj/mtbd/ft）
            let subName = mainSection;
            const sm = href.match(/\/zcjd\/([a-z]+)\//i);
            if (sm && SUB[sm[1]]) subName = SUB[sm[1]];
            results.push({
              title: title,
              url: href,
              date: date || (m ? `${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6,8)}` : ''),
              id: (m && m[2]) ? m[2] : href,
              section_name: '福建省住建厅-解读回应',
              subsection_name: subName,
              main_section: mainSection,
              issuing_authority: '福建省住房和城乡建设厅',
            });
          }
          return results;
        }
    detail:
      type: css_selector
      content_field: ".xl_con1.detailCont"
      metadata_js: |
        () => {
          const result = {
            publish_datetime: '',
            source: '',
            doc_number: '',
            issuing_authority: '福建省住房和城乡建设厅',
            topic_category: '',
            doc_id: '',
            files: [],
          };
          const gm = (n) => {
            const m = document.querySelector(`meta[name="${n}"]`);
            return (m && m.content) ? m.content.trim() : '';
          };
          result.publish_datetime = gm('PubDate');
          result.source = gm('ContentSource');
          result.topic_category = gm('ColumnName');
          result.doc_id = gm('DocId');
          // 附件：.myzj_xl_list 区域 <a href>
          for (const a of document.querySelectorAll('.myzj_xl_list a[href]')) {
            const href = a.href || '';
            if (!href) continue;
            if (!/\.(pdf|docx?|xlsx?|pptx?|ofd|zip|rar|7z|wps|et|dps|txt|jpe?g|png|tif{1,2})(\?|$)/i.test(href) &&
                !/P0\d{15,}/i.test(href)) continue;
            result.files.push({
              file_name: (a.textContent || '').trim() || href.split('/').pop(),
              file_url: href,
            });
          }
          // 发文字号：从正文首位匹配「X〔YYYY〕N号」（闽/国/住建/建设/发改/财政等）
          const bodyText = (document.querySelector('.xl_con1.detailCont')?.textContent || '').slice(0, 800);
          const dn = bodyText.match(/(?:闽|国|住建|建设|发改|财政)[\u4e00-\u9fa5]{0,15}〔\d{4}〕\s*\d+\s*号/);
          if (dn) result.doc_number = dn[0].trim();
          return result;
        }
    format:
      parser_id: "naive"
      upload_batch_size: 5
      template: |
        # {{ title }}

        **栏目:** {{ section_name }}
        **子栏目:** {{ subsection_name }}
        **发布机构:** {{ issuing_authority }}
        **发布日期:** {{ publish_datetime }}
        **发文字号:** {{ doc_number }}
        **来源:** {{ source }}
        **原文链接:** {{ url }}

        {{ content }}
    sections:
      # 回应关切 — Avalon SSR 列表
      - label: "hygq"
        name: "福建省住建厅-解读回应"
        listing:
          url: "https://zjt.fujian.gov.cn/jdhy/hygq/"
          method: GET
      # 政策解读 — 4 个子栏目混合 SSR 列表（由 js_extract 按 URL 分发 subName）
      - label: "zcjd"
        name: "福建省住建厅-解读回应"
        listing:
          url: "https://zjt.fujian.gov.cn/jdhy/zcjd/"
          method: GET
