  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # ggzy_policy — 全国公共资源交易平台-政策法规 (智能采集 policy 类)
  # Source: https://www.ggzy.gov.cn/SIC/web/policyFileList.po
  # List  : UL#contextId > LI > A.details.po?id=UUID + SPAN(date)
  # Detail: H4#txtCaption (title) / SPAN#txtPublishTime (date) / #divContent (body)
  #         .attachment_r A href (*.pdf / *.ofd / *.doc) 同级容器
  # Note  : transport.session_init_url 先打一次拿 JSESSIONID cookie，后续请求带 cookie，
  #         服务器就不再做 URL 重写 (不在 href 里嵌 ;jsessionid)，存库 URL 自然干净稳定。
  # --------------------------------------------------------------------------
