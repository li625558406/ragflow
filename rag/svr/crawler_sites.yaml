  # =========================================================================
  # 莆田市公共资源交易中心-服务中心 (智能采集 collection 模式)
  # 12 个分类栏目 via getFullTextDataNew ES API + 1 个今日开标 JSON
  # 参考: etrading 站点 (同 Epoint/Newpoint inteligentsearch API)
  # 老脚本: putian_fwzx_crawler.py (字段映射/选择器)
  # =========================================================================
  putian_ggzyjy_fwzx:
    name: "莆田市公共资源交易中心-服务中心"
    site_url: "http://ggzyjy.xzfwzx.putian.gov.cn"
    enabled: true
    category: bid
    detect_interval: 600
    detect_max_interval: 3600
    detect_quiet_hours: "0-7"
    transport:
      type: rest_api
      engine: requests
      verify_ssl: false
      timeout: 60
      headers:
        Content-Type: "application/json; charset=utf-8"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Referer: "http://ggzyjy.xzfwzx.putian.gov.cn/fwzx/"
    listing:
      url: "http://ggzyjy.xzfwzx.putian.gov.cn/inteligentsearch/rest/esinteligentsearch/getFullTextDataNew"
      method: POST
      body_type: json
      params:
        esdsid: "1"
        token: ""
        pn: 0
        rn: 50
        sdt: ""
        edt: ""
        wd: " "
        inc_wd: ""
        exc_wd: ""
        fields: "title"
        cnum: "001"
        sort: '{"istop":"0","ordernum":"0","webdate":"0"}'
        ssort: "title"
        cl: 1000
        cutIngore: "title;linkurl"
        terminal: ""
        condition:
          - fieldName: "categorynum"
            equal: "005001006"
            notEqual: null
            equalList: null
            notEqualList: null
            isLike: true
            likeType: 2
        time: []
        highlights: "title"
        statistics: null
        unionCondition: null
        accuracy: ""
        noParticiple: "1"
        searchRange: []
        isBusiness: "1"
    pagination:
      type: single_page
      items_field: "result.records"
    extract:
      type: json_path
      items_path: "result.records"
      fields:
        title: "title"
        url: "linkurl"
        date: "webdate"
        id: "infoid"
    detail:
      type: css_selector
      url: "http://ggzyjy.xzfwzx.putian.gov.cn{url}"
      content_field: ".ewb-article, .article-content, .detail-content, .TRS_Editor"
    anti_crawler:
      delay_min: 1.0
      delay_max: 2.5
      max_retries: 3
      max_consecutive_empty: 3
    format:
      parser_id: "naive"
      upload_batch_size: 10
      template: |
        # {{ title }}
        **发布日期:** {{ date }}
        **来源:** 莆田市公共资源交易中心
        **原文链接:** {{ source_url }}
        {{ content }}
    sections:
      # === 工程交易 (5个) ===
      - label: "zbjh"
        name: "莆田市-工程交易-招标计划"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005001021"
                isLike: true
                likeType: 2
      - label: "zbysgs"
        name: "莆田市-工程交易-招标文件预公示"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005001022"
                isLike: true
                likeType: 2
      - label: "zbxx"
        name: "莆田市-工程交易-招标信息"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005001006"
                isLike: true
                likeType: 2
      - label: "zbhxrgs"
        name: "莆田市-工程交易-中标候选人公示"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005001012"
                isLike: true
                likeType: 2
      - label: "zbjg"
        name: "莆田市-工程交易-中标结果公示"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005001011"
                isLike: true
                likeType: 2
      # === 政府采购 (2个) ===
      - label: "cggg"
        name: "莆田市-政府采购-采购公告"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005002003"
                isLike: true
                likeType: 2
      - label: "cgzbjg"
        name: "莆田市-政府采购-中标（成交）结果公告"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005002005"
                isLike: true
                likeType: 2
      # === 国土资源 (2个) ===
      - label: "gtjyxx"
        name: "莆田市-国土资源-交易信息"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005003003"
                isLike: true
                likeType: 2
      - label: "gtcjgs"
        name: "莆田市-国土资源-出让结果公示"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005003004"
                isLike: true
                likeType: 2
      # === 产权交易 (2个) ===
      - label: "cqjyxx"
        name: "莆田市-产权交易-交易信息"
        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
