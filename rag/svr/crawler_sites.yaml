            date:  "AUDIT_DATE_CHAR"
            region: "NAME"
            owner: "CROP_NAME"
            item_type: "TYPE"
            create_date: "CREATDATE"
          url_template: "http://zjfw.zhangzhou.gov.cn/imng/zjfw/browse/bidNotice/bidNoticeDetail?id={ID}&type={TYPE}"
        detail:
          type: css_selector
          content_field: "#div_continer, .its-page, .tab-content"
          metadata_js: |
            () => {
              const result = {};
              document.querySelectorAll('li, span, p, .info-item, td').forEach(el => {
                const t = (el.textContent || '').trim();
                if (t.length > 200) return;
                const m1 = t.match(/发布时间[：:]\s*([\d\-/: ]+)/);
                if (m1 && !result.publish_datetime) result.publish_datetime = m1[1].trim();
                const m2 = t.match(/信息来源[：:]\s*(.+)/);
                if (m2 && !result.issuing_authority) result.issuing_authority = m2[1].trim();
