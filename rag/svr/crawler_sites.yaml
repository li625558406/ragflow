        listing:
          method: POST
          body_type: json
          params:
            condition:
              - fieldName: "categorynum"
                equal: "005004007"
                isLike: true
                likeType: 2
      # === 今日开标 (1个，不同数据源) ===
      - label: "jrkb"
        name: "莆田市-今日开标"
        listing:
          url: "http://ggzyjy.xzfwzx.putian.gov.cn/json/todaykaib.json"
