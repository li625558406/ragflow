  # --------------------------------------------------------------------------
  # zjfw_zhangzhou_zcwj — 漳州市工程项目网上中介服务平台-政策法规
  # Target: http://zjfw.zhangzhou.gov.cn/imng/zjfw/index/serviceGuide/serviceGuide?name=ZCWJ
  # Adapter: spa_render (api-v2 REST endpoint requires s/t signature tokens that
  #          are generated client-side; navigating to the SPA page auto-fires
  #          the XHR which _setup_api_capture intercepts — same approach used
  #          by zjfw_score_sort)
  # Total: 3 historical policies (2024-07 / 2023-11); detail body is empty,
  #        real content lives in the PDF attachment.
  # --------------------------------------------------------------------------
  zjfw_zhangzhou_zcwj:
    name: "漳州市工程项目网上中介服务平台-政策法规"
    site_url: "http://zjfw.zhangzhou.gov.cn"
    category: policy                       # ★ 写 crawler_result + collection_policy_ext
    enabled: true
    detect_enabled: true                   # ★ 探测器自动增量
    detect_interval: 600
    transport:
      type: spa_render
      engine: playwright_spa
      network_idle: false                  # 政府站 analytics 让 networkidle 永不空闲
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36"
        Accept: "application/json, text/plain, */*"
      verify_ssl: false
      timeout: 60
    listing:
      url: "http://zjfw.zhangzhou.gov.cn/imng/zjfw/index/serviceGuide/serviceGuide?name=ZCWJ"
      method: GET
    pagination:
      type: single_page                    # 历史共 3 条，无分页
      items_field: "data"                  # XHR 响应 {"total":3,"data":[...]}
    anti_crawler:
      delay_min: 1.5
      delay_max: 3.0
      max_retries: 3
    extract:
      type: json_path
      items_path: "data"
      fields:
        id:    "ID"
        title: "TITLE"
        date:  "DISPLAYTIME"               # 格式 "YYYY-MM-DD" 或 "YYYY-MM-DD HH:mm:ss"
        # 政策扩展字段（→ collection_policy_ext）
        issuing_authority: "SOURCE"        # API 字段 SOURCE（多为空，attachment name 兜底）
        topic_category:    "TYPE_NAME"     # 政策文件
        doc_number:        "ATTACHMENT_NAME"  # 文件名常含文号 "漳建审改[2024]3号"
      url_template: "http://zjfw.zhangzhou.gov.cn/imng/zjfw/index/policy/policyDetail_view?id={ID}&tagName=%25E6%2594%25BF%25E7%25AD%2596%25E6%2596%2587%25E4%25BB%25B6&typeName=ZCWJ"
    sections:
      - label: "zcwj"
        name: "漳州市-政策法规"             # ★ 前端「类型」列展示 (engine 注入 section_name)
    detail:
      type: css_selector
      content_field: "#policies_regulations_tab"   # 详情主容器：header + meta + 正文 + 附件
      metadata_js: |
        () => {
          const result = {};
          // 发布时间: <li>发布时间：2024-07-02 09:09:34</li>
          document.querySelectorAll('li, span, p').forEach(el => {
            const t = (el.textContent || '').trim();
            const m = t.match(/发布时间[：:]\s*([\d\-/: ]+)/);
            if (m && !result.publish_datetime) result.publish_datetime = m[1].trim();
            const m2 = t.match(/信息来源[：:]\s*(.+)/);
            if (m2 && !result.issuing_authority) result.issuing_authority = m2[1].trim();
          });
          // 附件: 抓所有 .pdf/.doc/.docx/.xls/.xlsx/.zip/.rar 链接
          const files = [];
          document.querySelectorAll('a').forEach(a => {
            const href = a.href || '';
            const name = (a.textContent || '').trim();
            if (/\.(pdf|docx?|xlsx?|zip|rar|7z)(\?|$)/i.test(href) || href.includes('downloadagent')) {
              files.push({ file_url: href, file_name: name || href.split('/').pop() });
            }
          });
          if (files.length) result.files = files;
          // 文号从附件名解析 "漳建审改[2024]3号" 等
          const allText = document.body.innerText || '';
          const dn = allText.match(/(?:漳建|闽建|国发|国办发|政办|建审改|建设|市政府|省)?〔\s*\d{4}\s*〕\s*\d+\s*号|[\u4e00-\u9fa5]{2,10}\[\d{4}\]\d+\s*号/);
          if (dn) result.doc_number = dn[0];
          return result;
        }
    format:
      parser_id: "naive"
      template: |
        # {{ title }}

        **发布时间:** {{ date }}
        **来源:** 漳州市工程项目网上中介服务平台
        **原文链接:** {{ url }}

        {{ content }}
      upload_batch_size: 5

