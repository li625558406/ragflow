      verify_ssl: false
      timeout: 60
    listing:
      url: "https://fujian.etrading.cn/inteligentsearch/rest/esinteligentsearch/getFullTextDataNew"
      method: POST
      body_type: json
      params:
        siteGuid: "0c486005-4998-475c-8147-891741aeefb3"
        categorynum: "002003001"
        pn: "{{ page }}"
        rn: "{{ page_size }}"
    pagination:
      type: page_no
      page_param: "pn"
      page_size_param: "rn"
      page_size: 20
      start: 1
      max_pages: 50
      items_field: "result.records"
    anti_crawler:
      delay_min: 0.3
      delay_max: 0.8
      max_retries: 3
    extract:
      type: json_path
      items_path: "result.records"
      fields:
        id: "infoid"
        title: "title"
        date: "youxiaodate"
        url: "linkurl"
        content: "content"
    detail:
      type: css_selector
      url: "https://fujian.etrading.cn{{ linkurl }}"
      content_field: "#infoContent, #content, .info-content, .article-content, .main-content, #main"
    format:
      parser_id: "naive"
