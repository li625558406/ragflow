  # --------------------------------------------------------------------------
  # fujian_fgw_zwgk — 福建省发展和改革委员会 · 政务公开首页聚合页
  # Source: http://fgw.fujian.gov.cn/zwgk/  (TRS CMS + Avalon + jQuery)
  # 用户需求：采集政务公开首页多个列表（公示公告 / 政策文件 / 财政资金 / 规划计划 / 人事信息）
  #   - 政策文件列表每条包含「原文」+「相关解读/相关链接」两个超链接（.wj-a 通过
  #     getRelDoc AJAX 异步填充 href），spa_render 让 JS 执行完后用 js_extract 抓取
  #   - 详情页结构：.TRS_Editor 正文 + .article_attachment（附件，Avalon 渲染）+
  #     .article_relalinks（相关链接）+ .article_time/.article_source 元数据
  # 反爬：常规 UA + Referer 即可，无指纹/验证码；SPA 选择因 JS 必须执行
  # --------------------------------------------------------------------------
  fujian_fgw_zwgk:
    name: "福建省发改委-政务公开"
    site_url: "http://fgw.fujian.gov.cn"
    category: policy
    enabled: true
    detect_enabled: true
    detect_interval: 600              # 10 分钟轮询（首页聚合，更新频率中等）
    transport:
      type: spa_render
      engine: playwright_spa
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Referer: "http://fgw.fujian.gov.cn/zwgk/"
        Accept-Language: "zh-CN,zh;q=0.9"
      verify_ssl: false
      timeout: 30
      network_idle: false            # gov 站长连接(hm.baidu.com)使 networkidle 永不触发
    listing:
      url: "http://fgw.fujian.gov.cn/zwgk/"
      method: GET
    pagination:
      type: single_page              # 仅首页聚合（每栏目 ~6 条），不做分页
    anti_crawler:
      delay_min: 1.5
      delay_max: 3.0
      max_retries: 3
      max_consecutive_empty: 3
    extract:
      type: css_selector
      items_path: ".zwgk_con li"
      js_extract: |
        () => {
          // 等待 getRelDoc AJAX 填充 .wj-a[href]，未填充则返空触发 spa_render 重试
          const needRel = document.querySelectorAll('.zwgk_con .wj-a');
          const populated = document.querySelectorAll('.zwgk_con .wj-a[href]');
          if (needRel.length > 0 && populated.length === 0) {
            return [];  // 触发 spa_render 5×3s 重试，等 AJAX 完成
          }

          // 栏目 header 名（"公示公告" / "政策文件" / ...）映射：每个 tab 区块
          // 结构为 div.tabs > div.tabs_header > ul > li > a > 「文本」
          // 通过 DOM 位置回溯找到所属栏目标题。
          const sectionTitle = (el) => {
            let node = el.closest('.tabs, .list_base');
            while (node) {
              const hdr = node.querySelector && node.querySelector('.tabs_header a, .tabs_header2 a');
              if (hdr) {
                const t = (hdr.textContent || '').replace(/更多>*/g, '').trim();
                if (t) return t;
              }
              node = node.parentElement;
            }
            return '';
          };

          const results = [];
          const seen = new Set();
          // 只采 .zwgk_con 顶层 5 个聚合区块（公示公告/政策文件/财政资金/规划计划/人事信息）
          // 每个 li 含 1 个主超链接 <a href="...tYYYYMMDD_<id>.htm"> + 可选 <a class="wj-a">
          const lis = document.querySelectorAll('.zwgk_con li');
          for (const li of lis) {
            // 主链接：跳过 .wj-a 自身
            const mainA = li.querySelector('a:not(.wj-a)');
            if (!mainA) continue;
            let href = mainA.href || mainA.getAttribute('href') || '';
            if (!href) continue;
            // 标准化为绝对 URL
            try { href = new URL(href, location.href).href; } catch (e) { continue; }
            // 仅保留站内 .htm 详情页，跳过 PDF/外部链接
            if (!/fgw\.fujian\.gov\.cn\/.*\.htm$/i.test(href)) continue;
            const title = (mainA.getAttribute('title') || mainA.textContent || '').trim();
            if (!title || title.length < 4) continue;
            if (seen.has(href)) continue;
            seen.add(href);

            // 从 URL 解析 docid 与日期：t20260722_7190957.htm → [2026-07-22, 7190957]
            const m = href.match(/t(\d{8})_(\d+)\.htm/i);
            const date = m ? `${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6,8)}` : '';
            const docid = m ? m[2] : '';

            // 相关解读 / 相关链接（.wj-a 在 li 内，与主 a 同级）
            const wjA = li.querySelector('.wj-a[href]');
            let relatedUrl = '', relatedTitle = '', relatedType = '';
            if (wjA && wjA.getAttribute('href')) {
              relatedUrl = wjA.href || new URL(wjA.getAttribute('href'), location.href).href;
              relatedTitle = (wjA.getAttribute('title') || '').trim();
              relatedType = (wjA.textContent || '').replace(/[|｜]/g, '').trim();
            }

            results.push({
              title: title,
              url: href,
              date: date,
              id: docid || href,
              docid: docid,
              section_name: sectionTitle(li) || '福建省发改委-政务公开',
              related_url: relatedUrl,
              related_title: relatedTitle,
              related_type: relatedType,
              issuing_authority: '福建省发展和改革委员会',
            });
          }
          return results;
        }
    detail:
      type: css_selector
      content_field: ".TRS_Editor"
      metadata_js: |
        () => {
          const result = {
            publish_datetime: '',
            source: '',
            doc_number: '',
            issuing_authority: '福建省发展和改革委员会',
            topic_category: '',
            files: [],
            related_links: [],
          };
          // 发布时间：.article_time 显示「时间： 2026-07-22 15:33」
          const time = document.querySelector('.article_time');
          if (time) {
            const m = (time.textContent || '').match(/(\d{4}-\d{1,2}-\d{1,2}(?:\s+\d{1,2}:\d{1,2})?)/);
            if (m) result.publish_datetime = m[1];
          }
          // 来源：.article_source「来源:福建省发展和改革委员会网站」
          const src = document.querySelector('.article_source');
          if (src) result.source = (src.textContent || '').replace(/^来源[:：]/, '').trim();
          // 栏目名（topic_category）：面包屑最后一段
          const crumbs = document.querySelectorAll('.CurrChnlCls, .crumb a');
          if (crumbs.length) {
            result.topic_category = (crumbs[crumbs.length - 1].textContent || '').trim();
          }
          // 附件：.article_attachment 区域渲染后的 <a href>（Avalon 把 fLinks 数组渲染到 DOM）
          const attachLinks = document.querySelectorAll('.article_attachment li a[href]');
          for (const a of attachLinks) {
            const href = a.href || '';
            if (!href) continue;
            // 站内相对链接转绝对，仅保留附件特征 URL
            if (!/\.(pdf|docx?|xlsx?|pptx?|ofd|zip|rar|wps|et|dps)(\?|$)/i.test(href) &&
                !/P0\d{15,}/i.test(href)) continue;
            result.files.push({
              file_name: (a.textContent || '').trim() || href.split('/').pop(),
              file_url: href,
            });
          }
          // 相关链接：.article_relalinks 区域（与 .wj-a 互补，详情页 Avalon 渲染）
          const relAs = document.querySelectorAll('.article_relalinks li a[href]');
          for (const a of relAs) {
            result.related_links.push({
              title: (a.getAttribute('title') || a.textContent || '').trim(),
              url: a.href,
            });
          }
          // 发文字号：从正文首位匹配「X〔YYYY〕N号」「X规〔YYYY〕N号」等模式
          const bodyText = (document.querySelector('.TRS_Editor')?.textContent || '').slice(0, 500);
          const dn = bodyText.match(/(?:闽|国|发改|建设|交通|财政)[\u4e00-\u9fa5]{0,15}〔\d{4}〕\s*\d+\s*号/);
          if (dn) result.doc_number = dn[0].trim();
          return result;
        }
    format:
      parser_id: "naive"
      upload_batch_size: 5
      template: |
