  # --------------------------------------------------------------------------
  # cebpubservice — 中国招标投标公共服务平台 bulletin listing (SSR HTML)
  # Old script: cebpubservice_crawler.py
  # NOTE: Listing only — detail pages on ctbpsp.com are WAF-protected.
  # --------------------------------------------------------------------------
  cebpubservice:
    name: "中国招标投标公共服务平台"
    site_url: "https://bulletin.cebpubservice.com/"
    enabled: true
    detect_interval: 10
    transport:
      type: rest_api
      engine: requests
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
      verify_ssl: true
      timeout: 30
    listing:
      url: "https://bulletin.cebpubservice.com/xxfbcmses/search/bulletin.html"
      method: GET
      params:
        searchDate: "{{ today }}"
        dates: "1"
    pagination:
      type: page_no
      page_param: "page"
      page_size: 20
      start: 1
      max_pages: 5
    anti_crawler:
      delay_min: 0.5
      delay_max: 1.5
      max_retries: 3
    extract:
      type: css_selector
      items_path: "table.table_text tr"
      fields:
        id: "td:first-child a@href"
        title: "td:first-child a"
        date: "td:nth-child(5)"
        region: "td:nth-child(3)"
        source: "td:nth-child(4)"
    detail:
      type: css_selector
      content_field: "#bulletinContent, .bulletin-content, .detail-content, .TRS_Editor, article, main"
    format:
      parser_id: "naive"
      upload_batch_size: 10

