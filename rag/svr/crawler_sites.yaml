# ============================================================================
# Unified Crawler Framework — Site Configuration
# ============================================================================
# Generated from actual crawler script analysis.  Each site_id maps to one
# old *_crawler.py script.  Transport types:
#
#   rest_api       — plain HTTP JSON/HTML (requests.Session or urllib)
#   encrypted_api  — SM4-ECB or AES-256-CBC with MD5 signing (urllib)
#   spa_render     — Vue/React SPA requiring headless browser (sync_playwright)
#   playwright_http — browser HTTP fingerprints (PlaywrightHttpClient)
#
# Pagination types:
#   page_no, offset, total_count, html_regex, click_next, single_page
#
# ── category 字段（新智能采集系统使用）───────────────────────────────────
# 每个站点可声明 category 决定采集结果归属：
#   bid        — 招投标类（默认，写 crawler_result + extracted_json）
#   policy     — 政策法规类（写 crawler_result + collection_policy_ext 扩展字段）
#   personnel  — 人员信息类（写 crawler_result + collection_personnel_ext 扩展字段）
#   news       — 新闻资讯类（写 crawler_result + extracted_json）
#   other      — 其他类型（写 crawler_result + extracted_json）
#
# 触发方式：
#   手动：POST /api/v1/collection/trigger {site_id, category, kb_id, full}
#   定时：POST /api/v1/collection/scheduled {site_id, category, schedule_type, ...}
# 旧 bid_* 表族不受影响（writer=bid 模式不读 category 字段）。
#
# 政策类 YAML 示例（policy 专用字段会自动映射到 collection_policy_ext）：
#   some_policy_site:
#     category: policy
#     name: "..."
#     transport: { type: rest_api }
#     listing: { url: "...", method: GET }
#     pagination: { type: page_no, page_size: 20 }
#     extract:
#       type: json_path
#       items_path: "data.rows"
#       fields:
#         title: "title"
#         url: "url"
#         date: "publishDate"
#         # ── 政策扩展字段（写入 collection_policy_ext）──
#         doc_number: "wenhao"                # 发文字号
#         issuing_authority: "fawenjigou"     # 发文机构
#         authority_level: "xiaoli"           # 效力级别
#         topic_category: "zhuti"             # 主题分类
#         effective_date: "shixingri"         # 实施日期
#         expiry_date: "shixiaori"            # 失效日期
#         status: "zhuangtai"                 # 有效/废止
#         legal_basis: "yiju"                 # 依据上位法
#
# 人员类 YAML 示例（personnel 专用字段映射到 collection_personnel_ext）：
#   some_personnel_site:
#     category: personnel
#     extract:
#       fields:
#         person_name: "xm"           # 姓名
#         cert_no: "zsh"              # 证书编号
#         cert_type: "zslx"           # 证书类型
#         employer: "danwei"          # 所属单位
#         specialty: "zhuanye"        # 注册专业
#         valid_until: "yxq"          # 有效期
# ============================================================================

version: "1.1"

# Global defaults for detection mode
defaults:
  detect_interval: 300      # 5 minutes (default for all sites)
  detect_enabled: true     # all sites participate in detection
  category: bid            # default category for sites that don't specify (legacy compat)

sites:

# ============================================================================
# REST API SITES — plain HTTP with requests/urllib (≈45 sites)
# ============================================================================

  # --------------------------------------------------------------------------
  # ccgp_agency — CCGP agency list (EasyUI datagrid JSON, listing only)
  # Old script: ccgp_crawler.py
  # --------------------------------------------------------------------------
  ccgp_agency:
    name: "政府采购代理机构名单"
    site_url: "http://www.ccgp.gov.cn/agency/md/"
    detect_interval: 30
    enabled: true  # by design: agency contact info, no article content
    transport:
      type: rest_api
      engine: requests
      session_init_url: "http://jczy.ccgp.gov.cn/gs1/gs1agentreg/pubListIndex.regx"
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
        Referer: "http://jczy.ccgp.gov.cn/gs1/gs1agentreg/pubListIndex.regx"
        Accept: "application/json, text/javascript, */*; q=0.01"
        X-Requested-With: "XMLHttpRequest"
      verify_ssl: true
      timeout: 60
    listing:
      url: "http://jczy.ccgp.gov.cn/gs1/gs1agentreg/getPubList.regx"
      method: GET
      body_type: query
      params:
        provinceCode: ""
        page: "{{ page }}"
        rows: "{{ page_size }}"
    pagination:
      type: page_no
      page_param: "page"
      page_size_param: "rows"
      page_size: 30
      start: 1
      max_pages: 5
      total_field: "total"
      items_field: "rows"
    anti_crawler:
      delay_min: 1.0
      delay_max: 2.5
      max_retries: 4
      session_reset_on_429: true
    extract:
      type: json_path
      items_path: "rows"
      fields:
        id: "uuid"
        title: "agentNm"
        orgCode: "orgCode"
        contactNm: "contactNm"
        corpTel: "corpTel"
        regAddr: "regAddr"
        regValidDateStr: "regValidDateStr"
        auditPlace: "auditPlace"
        publicRemark: "publicRemark"
    detail:
      type: inline
    format:
      parser_id: "naive"
      upload_batch_size: 500

  # --------------------------------------------------------------------------
  # ccgp_jdcf_gg_cr — CCGP supervision/announcement/violations (HTML scraping)
  # Old script: ccgp_jdcf_gg_cr_crawler.py
  # --------------------------------------------------------------------------
  ccgp_jdcf_gg_cr:
    name: "中国政府采购网-监督处罚+公告+严重违法失信"
    site_url: "http://www.ccgp.gov.cn/"
    enabled: false  # DISABLED: listing URL empty, CSS selector broken
    transport:
      type: rest_api
      engine: requests
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
      verify_ssl: true
      timeout: 60
    anti_crawler:
      delay_min: 1.0
      delay_max: 2.0
      max_retries: 3
    extract:
      type: css_selector
      items_path: ""
      fields:
        id: "a@href"
        title: "title"
        date: "date"
    detail:
      type: css_selector
      content_field: "content"
    format:
      parser_id: "naive"
      upload_batch_size: 10
    sections:
      - label: "jdcf"
        listing:
          url: "http://www.ccgp.gov.cn/jdjc/jdcf/"
          method: GET
        pagination:
          type: html_regex
          next_page_regex: "index_(\\d+)\\.htm"
          page_size: 20
          start: 1
      - label: "gg"
        listing:
          url: "http://www.ccgp.gov.cn/gg/"
          method: GET
        pagination:
          type: single_page
      - label: "cr"
        listing:
          url: "http://www.ccgp.gov.cn/search/cr/"
          method: GET
        pagination:
          type: single_page

