  # --------------------------------------------------------------------------
  # jdhy — 福建省发改委 · 解读回应 (TRS CMS + Avalon/MVVM SPA)
  # Source: http://fgw.fujian.gov.cn/jdhy/
  #   民生关注  /jdhy/msgz/   (Avalon 渲染, 540 条, pageSize=15)
  #   政策解读  /jdhy/zcjd/   (SSR 静态, 同页 3 个 list_base 块: bmzcwjjd/szfzcwjjd/qtzcwjjd)
  #   政策问答  /jdhy/zcwd/   (Avalon 渲染)
  # 详情页结构：.article_content 正文 + .article_attachment 附件(Avalon fLinks) +
  #   .article_time / .article_source 元数据 + meta[PubDate/ContentSource/ArticleTitle]
  # 反爬：常规 UA + Referer 即可，无加密/验证码；SPA 必须用 spa_render 让 JS 执行
  # --------------------------------------------------------------------------
  jdhy:
    name: "福建省发改委-解读回应"
    site_url: "http://fgw.fujian.gov.cn"
    category: policy
    enabled: true
    detect_enabled: true
    detect_interval: 600              # 10 分钟轮询一次
    transport:
      type: spa_render
      engine: playwright_spa
      headers:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
        Referer: "http://fgw.fujian.gov.cn/jdhy/"
        Accept-Language: "zh-CN,zh;q=0.9"
      verify_ssl: false
      timeout: 30
      network_idle: false            # gov 站长连接(hm.baidu.com)使 networkidle 永不触发
    pagination:
      type: single_page              # 每栏目首页列表，不做分页（trigger 默认 date_filter=today）
    anti_crawler:
      delay_min: 1.5
      delay_max: 3.0
      max_retries: 3
      max_consecutive_empty: 3
    extract:
      type: css_selector
      items_path: ".list_base li"    # 兜底选择器，实际靠 js_extract 出数据
      fields:
        id:    "a@href"
        title: "a@title"
        url:   "a@href"
        date:  "span"
      # 统一 js_extract：根据当前 URL 路径（msgz/zcjd/zcwd）分发到不同提取逻辑。
      # 必须放在父级 extract 而非 section extract，因为 spa_render adapter 只读父级
      # extract.js_extract（section.js_extract 会被 _maybe_extract_from_html 覆盖）。
      js_extract: |
        () => {
          const results = [];
          const seen = new Set();
          const path = location.pathname;
          // 子栏目映射：URL 子目录 → 中文名
          const ZCJD_SUB = {
            bmzcwjjd: '我委政策文件解读',
            szfzcwjjd: '省政府政策文件解读',
            qtzcwjjd: '其他政策文件解读',
          };
          // 决定主栏目名（按 URL 路径）
          let mainSection = '政策解读';
          let defaultSub = '政策解读';
          if (/\/msgz\//i.test(path)) { mainSection = '民生关注'; defaultSub = '民生关注'; }
          else if (/\/zcwd\//i.test(path)) { mainSection = '政策问答'; defaultSub = '政策问答'; }
          else if (/\/zcjd\//i.test(path)) { mainSection = '政策解读'; defaultSub = '政策解读'; }

          // 遍历所有列表 li（兼容 .list_base / .zcwd_cjwt / .news_list）
          const lis = document.querySelectorAll(
            '.list_base li, .zcwd_cjwt li, .news_list li'
          );
          for (const li of lis) {
            const a = li.querySelector('a[href]');
            if (!a) continue;
            let href = a.href || a.getAttribute('href') || '';
            if (!href) continue;
            try { href = new URL(href, location.href).href; } catch (e) { continue; }
            // 严格限制：仅采 fgw.fujian.gov.cn/jdhy/ 下的 .htm（避免跨栏目采到 zwgk）
            if (!/fgw\.fujian\.gov\.cn\/jdhy\/.*\.htm/i.test(href)) continue;
            const title = (a.getAttribute('title') || a.textContent || '').trim();
            if (!title || title.length < 4) continue;
            if (seen.has(href)) continue;
            seen.add(href);
            const span = li.querySelector('span');
            let date = '';
            if (span) {
              const txt = (span.textContent || '').trim();
              // 只接受 YYYY-MM-DD / YYYY.MM.DD / YYYY/MM/DD 格式
              if (/\d{4}[-./]\d{1,2}[-./]\d{1,2}/.test(txt)) date = txt;
            }
            const m = href.match(/t(\d{8})_(\d+)\.htm/i);
            // 子栏目名（仅 zcjd 有子目录 bmzcwjjd/szfzcwjjd/qtzcwjjd）
            let subName = defaultSub;
            const urlSub = href.match(/\/zcjd\/([a-z_]+)\//i);
            if (urlSub && ZCJD_SUB[urlSub[1]]) subName = ZCJD_SUB[urlSub[1]];
            results.push({
              title: title,
              url: href,
              date: date || (m ? `${m[1].slice(0,4)}-${m[1].slice(4,6)}-${m[1].slice(6,8)}` : ''),
              id: (m && m[2]) ? m[2] : href,
              section_name: '福建省发改委-解读回应',
              subsection_name: subName,
              main_section: mainSection,
              issuing_authority: '福建省发展和改革委员会',
            });
          }
          return results;
        }
    detail:
      type: css_selector
      content_field: ".article_content"
      metadata_js: |
        () => {
          const result = {
            publish_datetime: '',
            source: '',
            doc_number: '',
            issuing_authority: '福建省发展和改革委员会',
            topic_category: '',
            files: [],
          };
          // 发布时间：meta PubDate 优先，回退 .article_time
          const meta = document.querySelector('meta[name="PubDate"]');
          if (meta && meta.content) {
            result.publish_datetime = meta.content.trim();
          } else {
            const t = document.querySelector('.article_time');
            if (t) {
              const m = (t.textContent || '').match(/(\d{4}-\d{1,2}-\d{1,2}(?:\s+\d{1,2}:\d{1,2})?)/);
              if (m) result.publish_datetime = m[1];
            }
          }
          // 来源
          const cmeta = document.querySelector('meta[name="ContentSource"]');
          if (cmeta && cmeta.content) {
            result.source = cmeta.content.trim();
          } else {
            const s = document.querySelector('.article_source');
            if (s) result.source = (s.textContent || '').replace(/^来源[:：]/, '').trim();
          }
          // 栏目名（topic_category）：面包屑最后一段
          const crumbs = document.querySelectorAll('.CurrChnlCls, .crumb a');
          if (crumbs.length) {
            result.topic_category = (crumbs[crumbs.length - 1].textContent || '').trim();
          }
          // 附件：.article_attachment 区域 Avalon fLinks 渲染后的 <a href>
          const attachLinks = document.querySelectorAll('.article_attachment li a[href]');
          for (const a of attachLinks) {
            const href = a.href || '';
            if (!href) continue;
            if (!/\.(pdf|docx?|xlsx?|pptx?|ofd|zip|rar|7z|wps|et|dps|txt|jpe?g|png|tif{1,2})(\?|$)/i.test(href) &&
                !/P0\d{15,}/i.test(href)) continue;
            result.files.push({
              file_name: (a.textContent || '').trim() || href.split('/').pop(),
              file_url: href,
            });
          }
          // 发文字号：从正文首位匹配「X〔YYYY〕N号」
          const bodyText = (document.querySelector('.article_content')?.textContent || '').slice(0, 500);
          const dn = bodyText.match(/(?:闽|国|发改|建设|交通|财政)[\u4e00-\u9fa5]{0,15}〔\d{4}〕\s*\d+\s*号/);
          if (dn) result.doc_number = dn[0].trim();
          return result;
        }
    format:
      parser_id: "naive"
      upload_batch_size: 5
      template: |
        # {{ title }}

        **栏目:** {{ section_name }}
        **子栏目:** {{ subsection_name }}
        **发布机构:** {{ issuing_authority }}
        **发布日期:** {{ publish_datetime }}
        **发文字号:** {{ doc_number }}
        **来源:** {{ source }}
        **原文链接:** {{ url }}

        {{ content }}
    sections:
      # 民生关注 — Avalon 动态列表，统一 js_extract（在父级 extract）按 URL 分发
      - label: "msgz"
        name: "福建省发改委-解读回应"
        listing:
          url: "http://fgw.fujian.gov.cn/jdhy/msgz/"
          method: GET
      # 政策解读 — SSR 静态同页 3 个 list_base 块（bmzcwjjd/szfzcwjjd/qtzcwjjd）
      - label: "zcjd"
        name: "福建省发改委-解读回应"
        listing:
          url: "http://fgw.fujian.gov.cn/jdhy/zcjd/"
          method: GET
      # 政策问答 — Avalon 动态列表
      - label: "zcwd"
        name: "福建省发改委-解读回应"
        listing:
          url: "http://fgw.fujian.gov.cn/jdhy/zcwd/"
          method: GET
