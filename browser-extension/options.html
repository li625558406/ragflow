<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 — RAGFlow Web Clipper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 13px;
      padding: 32px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 12px;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #3a3a5a;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: #6366f1;
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 3px;
    }
    .btn {
      padding: 9px 20px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #6366f1;
      color: #fff;
    }
    .btn:hover {
      background: #818cf8;
    }
    .success {
      margin-top: 8px;
      color: #6ee7b7;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>⚙ 设置</h1>

  <div class="field">
    <label>RAGFlow 服务器地址</label>
    <input type="text" id="serverUrl" placeholder="http://47.98.102.55:9380">
    <div class="hint">B端访问地址，包含端口号</div>
  </div>

  <div class="field">
    <label>API Key</label>
    <input type="text" id="apiKey" placeholder="ragflow-...">
    <div class="hint">在 B端 → 右上角头像 → API 密钥 中获取</div>
  </div>

  <button class="btn" id="saveBtn">保存</button>
  <div id="msg" class="hidden"></div>

  <script src="options.js"></script>
</body>
</html>
